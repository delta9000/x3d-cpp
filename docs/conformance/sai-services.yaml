    binding_obligations: [CPP-4.3.3.1-FIELD-USER-DATA]
    preserves: [INV-ID-1, INV-LIFE-1, INV-EDIT-1]

  # Multi-field edits use revision-bound semantic wrappers; snapshots never
  # expose mutable generated vectors.
  - <<: *query
