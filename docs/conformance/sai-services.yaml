# ISO/IEC 19775-2 abstract-service inventory mapped to the intended modern C++
# surface. This is a convergence register, not a claim that ISO/IEC 19777-4's
# legacy class layout should be reproduced.
#
# support:
#   implemented  complete portable SAI behavior with executable coverage
#   partial      useful x3d-sai behavior exists, but its surface or semantics
#                do not yet satisfy the complete abstract service
#   planned      no suitable public semantic service yet
#   unsupported  intentionally unavailable (must carry a reason in `errors`)
#
# A planned:* symbol or test is an explicit gap. YAML merge anchors keep the
# repeated ISO-wide policy visible here without obscuring per-service semantics.
schema_version: 1

defaults:
  query: &query
    profiles: [inspection]
    errors: optional absence is distinct from invalid context and implementation failure
    buffering: reads the latest committed state
    events: none
  browser_query: &browser_query
    profiles: [inspection, live, browser-adapter]
    errors: optional absence is distinct from invalid browser generation, unavailable capability, and adapter failure
    buffering: reads the latest committed browser generation
    events: none
  command: &command
    profiles: [authoring, live]
    errors: structured invalid-operation, invalid-context, and capability errors
    buffering: participates in the active mutation scope; otherwise commits at the documented service boundary
    events: effects are observable only after the commit boundary
  browser_command: &browser_command
    profiles: [authoring, live, browser-adapter]
    errors: structured invalid-operation, invalid-generation, capability, and adapter errors
    buffering: participates in browser update control; otherwise publishes at the service boundary
    events: world and field effects become observable at the browser publication boundary
  observer: &observer
    profiles: [inspection, live, browser-adapter]
    errors: invalid source, stale generation, and dispatcher failure are distinct
    buffering: registration and cancellation are immediate; delivery observes committed state only
    events: callbacks are ordered by causal publication and held by a cancellable RAII subscription
  console: &console
    profiles: [live, browser-adapter]
    errors: adapter output failure is reported without mutating scene state
    buffering: output is forwarded immediately according to host console policy
    events: none
  async: &async
    profiles: [live, browser-adapter]
    errors: completion distinguishes success, cancellation, timeout, invalid input, and transport or decode failure
    buffering: completion publishes one coherent scene or capability result
    events: completion is delivered through an explicit dispatcher with cancellable subscription lifetime

services:
  # Reconcile the split kernel's existing public services. These are partial
  # native/offline implementations, not new claims of complete ISO semantics.
  - <<: *query
    id: SVC-CONTEXT-NAMED-NODE-GET
    clause: ISO/IEC 19775-2:2015, 6.4.7 getNode (local)
    public_symbol: x3d::sai::experimental::scene_snapshot::named
    support: partial
    errors: structured local-name lookup errors; imported lookup is a separate service
    tests: [sai_context_export_isolation, sai_context_alias_collision]
    preserves: [INV-ID-3, INV-EDIT-5]
  - <<: *command
    id: SVC-CONTEXT-NAMED-NODE-UPDATE
    clause: ISO/IEC 19775-2:2015, 6.4.10 namedNodeHandling (local update)
    public_symbol: x3d::sai::experimental::scene_edit::define_name
    support: partial
    errors: atomic local collision checks exist; complete live named-node semantics remain unaudited
    tests: [sai_edit_atomic_indexes, sai_context_alias_collision, sai_edit_query_mutation_dual]
    preserves: [INV-ID-3, INV-EDIT-1, INV-EDIT-5]
  - <<: *query
    id: SVC-CONTEXT-ROOTS-GET
    clause: ISO/IEC 19775-2:2015, 6.4.15 getRootNodes
    public_symbol: x3d::sai::experimental::scene_snapshot::roots
    support: partial
    errors: returns an ordered immutable snapshot view; live-host behavior is not implemented
    tests: [sai_edit_query_mutation_dual, sai_id_occurrence_edge]
    preserves: [INV-ID-2, INV-EDIT-5, INV-ORDER-1]
  - <<: *command
    id: SVC-SCENE-ROOTS-WRITE
    clause: ISO/IEC 19775-2:2015, 6.5.5 rootNodeHandling
    public_symbol: x3d::sai::experimental::scene_edit::append_root
    support: partial
    errors: append_root and remove_root validate offline edits; no live runtime adapter
    tests: [sai_edit_query_mutation_dual, sai_life_remove_atomic]
    preserves: [INV-ID-2, INV-EDIT-1, INV-EDIT-5]
  - <<: *command
    id: SVC-CONTEXT-NODE-CREATE
    clause: ISO/IEC 19775-2:2015, 6.4.8 createNode
    public_symbol: x3d::sai::experimental::scene_edit::create_node
    support: partial
    errors: typed errors reject invalid edits without repair; full source-location and causal diagnostics and live creation remain incomplete
    tests: [sai_edit_failure_nonmutation, sai_cxx_failure_value, sai_generated_error_parity]
    preserves: [INV-ID-1, INV-VAL-1, INV-VAL-2]
  - <<: *query
    id: SVC-NODE-FIELD-DEFINITIONS
    clause: ISO/IEC 19775-2:2015, 6.6.5 getFieldDefinitions
    public_symbol: x3d::sai::experimental::scene_snapshot::describe
    support: partial
    errors: generated descriptor and typed-key parity is tested; complete semantic projection, constraints and units remain unaudited
    tests: [sai_generated_binding_parity, sai_generated_binding_drift, sai_generated_registry_provenance, sai_generated_registry_mutation]
    preserves: [INV-GEN-1, INV-FIELD-1]
  - <<: *query
    id: SVC-CONTEXT-ROUTES-GET
    clause: ISO/IEC 19775-2:2015, 6.4.16 getRoutes
    public_symbol: x3d::sai::experimental::scene_snapshot::routes
    support: partial
    errors: ordered offline route descriptors are available; live cross-context routes are not implemented
    tests: [sai_edit_query_mutation_dual, sai_edit_atomic_indexes]
    preserves: [INV-EDIT-5, INV-ORDER-1]
  # Planned responsibilities must have an owner too. Cross-linking them fixes
  # register health, not missing implementation or executable evidence.
  - <<: *browser_command
    id: SVC-BROWSER-IMPORT-DOCUMENT
    clause: ISO/IEC 19775-2:2015, 6.3.13 importDocument
    public_symbol: planned:x3d::sai::browser::import_document
    support: planned
    errors: no document adapter exists; provenance, explicit repair and complete structured ingestion diagnostics remain planned native policy
    tests: [planned:sai_rt_source_fidelity, planned:sai_val_no_secret_repair, planned:sai_val_stable_diagnostic]
    preserves: [INV-RT-2, INV-VAL-1, INV-VAL-2]
  - <<: *browser_query
    id: SVC-NATIVE-ABI-BOUNDARY
    clause: Native C++ extension policy INV-CXX-5; not an ISO abstract service
    public_symbol: planned:x3d::sai::adapter_abi_version
    support: planned
    errors: no versioned binary adapter exists; the source C++ API makes no stable STL or exception ABI promise
    tests: [planned:sai_cxx_abi_boundary]
    preserves: [INV-CXX-5]
  - <<: *browser_query
    id: SVC-BROWSER-DESCRIPTION-READ
    clause: ISO/IEC 19777-4:2015, Browser description binding utility
    public_symbol: planned:x3d::sai::browser::description
    support: planned
    tests: [planned:sai_browser_description_read]
    preserves: [INV-LIFE-1, INV-PORT-1]
  - <<: *browser_command
    id: SVC-BROWSER-DESCRIPTION-WRITE
    clause: ISO/IEC 19775-2:2015, 6.3.15 setDescription
    public_symbol: planned:x3d::sai::browser::set_description
    support: planned
    tests: [planned:sai_browser_description_write]
    preserves: [INV-EDIT-1, INV-PORT-1]
  - <<: *browser_query
    id: SVC-BROWSER-SUPPORTED-PROFILES
    clause: ISO/IEC 19775-2:2015, 6.3.6 getSupportedProfiles
    public_symbol: planned:x3d::sai::browser::supported_profiles
    support: planned
    tests: [planned:sai_browser_supported_profiles]
    preserves: [INV-CAP-1, INV-PORT-1]
  - <<: *browser_query
    id: SVC-BROWSER-SUPPORTED-COMPONENTS
    clause: ISO/IEC 19775-2:2015, 6.3.8 getSupportedComponents
    public_symbol: planned:x3d::sai::browser::supported_components
    support: planned
    tests: [planned:sai_browser_supported_components]
    preserves: [INV-CAP-1, INV-PORT-1]
  - <<: *browser_query
    id: SVC-BROWSER-CURRENT-SCENE
    clause: ISO/IEC 19775-2:2015, 6.3.10 getExecutionContext
    public_symbol: x3d::sai::experimental::browser::current_scene
    support: partial
    tests: [sai_life_stale_handle]
    preserves: [INV-ID-1, INV-LIFE-1, INV-CONC-1, INV-CXX-1]
  - <<: *browser_command
    id: SVC-BROWSER-REPLACE-WORLD
    clause: ISO/IEC 19775-2:2015, 6.3.12 replaceWorld
    public_symbol: x3d::sai::experimental::browser::replace_world
    support: partial
    tests: [sai_life_stale_handle]
    preserves: [INV-LIFE-1, INV-EDIT-1, INV-EDIT-3]
  - <<: *async
    id: SVC-BROWSER-LOAD-URL
    clause: ISO/IEC 19775-2:2015, 6.3.14 loadURL
    public_symbol: x3d::sai::experimental::browser::begin_load
    support: partial
    tests: [sai_evt_stale_async]
    preserves: [INV-LIFE-1, INV-EDIT-3, INV-EVT-5]
  - <<: *browser_command
    id: SVC-BROWSER-BEGIN-UPDATE
    clause: ISO/IEC 19775-2:2015, 6.3.19 updateControl (begin)
    public_symbol: x3d::sai::experimental::execution_context::edit
    support: partial
    tests: [sai_edit_failure_nonmutation]
    preserves: [INV-EDIT-1, INV-EDIT-4, INV-CXX-3]
  - <<: *browser_command
    id: SVC-BROWSER-END-UPDATE
    clause: ISO/IEC 19775-2:2015, 6.3.19 updateControl (end)
    public_symbol: x3d::sai::experimental::scene_edit::commit
    support: partial
    tests: [sai_edit_failure_nonmutation]
    preserves: [INV-EDIT-1, INV-EDIT-2, INV-EVT-1]
  - <<: *observer
    id: SVC-BROWSER-LISTENER
    clause: ISO/IEC 19775-2:2015, 6.3.20 registerBrowserInterest
    public_symbol: x3d::sai::experimental::execution_context::observe
    support: partial
    tests: [sai_evt_observer_mutation, sai_cxx_safe_destruction]
    binding_obligations: [CPP-4.3.1.2-CALLBACK-ROBUSTNESS]
    preserves: [INV-CXX-3, INV-EVT-3, INV-CONC-1, INV-EVT-5, INV-EVT-4]

  # Scene creation and parsing. Existing codecs are useful implementation
  # mechanisms, but synchronous X3DDocument return values are not yet the SAI.
  - <<: *command
    id: SVC-SCENE-CREATE-EMPTY
    clause: ISO/IEC 19775-2:2015, 6.3.11 createScene
    public_symbol: x3d::sai::experimental::browser::create_scene
    support: partial
    tests: [sai_life_stale_handle]
    preserves: [INV-ID-1, INV-CAP-1, INV-EDIT-3]
  - <<: *query
    id: SVC-CONTEXT-UNITS
    clause: ISO/IEC 19775-2:2015, 6.4.5 getUnits
    public_symbol: x3d::sai::experimental::scene_snapshot::units
    support: partial
    tests: [sai_field_units_once]
    preserves: [INV-FIELD-4, INV-CAP-1, INV-PORT-1]
  - <<: *query
    id: SVC-CONTEXT-WORLD-URL
    clause: ISO/IEC 19775-2:2015, 6.4.6 getWorldURL
    public_symbol: planned:x3d::sai::execution_context::world_url
    support: planned
    tests: [planned:sai_context_world_url]
    preserves: [INV-CXX-2, INV-PORT-1]
  - <<: *command
    id: SVC-CONTEXT-NAMED-NODE-REMOVE
    clause: ISO/IEC 19775-2:2015, 6.4.10 namedNodeHandling (remove)
    public_symbol: x3d::sai::experimental::scene_edit::undefine_name
    support: partial
    tests: [sai_edit_query_mutation_dual]
    preserves: [INV-OWN-1, INV-EDIT-1, INV-EDIT-3]
  - <<: *query
    id: SVC-CONTEXT-IMPORTED-NODE-GET
    clause: ISO/IEC 19775-2:2015, 6.4.7 getNode (imported)
    public_symbol: x3d::sai::experimental::scene_snapshot::imported
    support: partial
    tests: [sai_context_import_authority, sai_context_import_snapshot]
    preserves: [INV-ID-2, INV-OWN-2, INV-CXX-2]
  - <<: *command
    id: SVC-CONTEXT-IMPORTED-NODE-UPDATE
    clause: ISO/IEC 19775-2:2015, 6.4.10 namedNodeHandling (import update)
    public_symbol: x3d::sai::experimental::scene_edit::import_node
    support: partial
    tests: [sai_context_import_authority, sai_context_alias_collision, sai_context_aperture_revalidate]
    preserves: [INV-OWN-2, INV-EDIT-1, INV-EDIT-3]
  - <<: *command
    id: SVC-CONTEXT-IMPORTED-NODE-REMOVE
    clause: ISO/IEC 19775-2:2015, 6.4.10 namedNodeHandling (import remove)
    public_symbol: x3d::sai::experimental::scene_edit::remove_import
    support: partial
    tests: [sai_context_import_removal]
    preserves: [INV-OWN-1, INV-OWN-2, INV-EDIT-3]

  - <<: *command
    id: SVC-NODE-DISPOSE
    clause: ISO/IEC 19775-2:2015, 6.6.6 dispose
    public_symbol: x3d::sai::experimental::node::dispose
    support: implemented
    tests: [sai_life_wrapper_disposal]
    binding_obligations: [CPP-4.3.6-DISPOSAL]
    errors: none; disposal is noexcept and idempotent
    buffering: invalidates only the local wrapper immediately
    events: none
    preserves: [INV-LIFE-1, INV-OWN-1, INV-CXX-3]
  - <<: *query
    id: SVC-NODE-USER-DATA-READ
    clause: ISO/IEC 19777-4, 4.3.3.1 node user-data identity
    public_symbol: planned:x3d::sai::node::user_data
    support: planned
    tests: [planned:sai_node_user_data_read]
    binding_obligations: [CPP-4.3.3.1-NODE-USER-DATA]
    preserves: [INV-ID-1, INV-LIFE-1, INV-CXX-1]
  - <<: *command
    id: SVC-NODE-USER-DATA-WRITE
    clause: ISO/IEC 19777-4, 4.3.3.1 node user-data identity
    public_symbol: planned:x3d::sai::node::set_user_data
    support: planned
    tests: [planned:sai_node_user_data_write]
    binding_obligations: [CPP-4.3.3.1-NODE-USER-DATA]
    preserves: [INV-ID-1, INV-LIFE-1, INV-EDIT-1]
  - <<: *command
    id: SVC-PROTO-INSTANCE-CREATE
    clause: ISO/IEC 19775-2:2015, 6.4.9 createProto; 6.9.2 createInstance
    public_symbol: planned:x3d::sai::proto_declaration::create_instance
    support: planned
    tests: [planned:sai_proto_instance_create]
    preserves: [INV-OWN-1, INV-OWN-2, INV-EDIT-3]

  - <<: *query
    id: SVC-FIELD-READ
    clause: ISO/IEC 19775-2:2015, 6.7.5 getValue
    public_symbol: x3d::sai::experimental::scene_snapshot::read
    support: partial
    tests: [sai_field_pure_read, sai_field_units_once]
    preserves: [INV-FIELD-1, INV-FIELD-3, INV-FIELD-5, INV-CXX-4]
  - <<: *command
    id: SVC-FIELD-WRITE
    clause: ISO/IEC 19775-2:2015, 6.7.6 setValue
    public_symbol: x3d::sai::experimental::scene_edit::set
    support: partial
    tests: [sai_field_specialized_access, sai_field_units_once, sai_own_node_value, sai_own_node_range, sai_evt_input_transient, sai_evt_inputoutput_publish, sai_evt_typed_generic, sai_own_event_nodes]
    preserves: [INV-FIELD-2, INV-FIELD-3, INV-FIELD-4, INV-CXX-4, INV-EVT-1]
  - <<: *observer
    id: SVC-FIELD-OBSERVE
    clause: ISO/IEC 19775-2:2015, 6.7.7 registerFieldInterest
    public_symbol: x3d::sai::experimental::execution_context::observe
    support: partial
    tests: [sai_evt_field_observer, sai_evt_reentrant_batch]
    binding_obligations: [CPP-A.4.5-FIELD-OBSERVATION]
    preserves: [INV-CXX-3, INV-EVT-2, INV-EVT-3]
  - <<: *query
    id: SVC-FIELD-READABLE
    clause: ISO/IEC 19777-4, Annex A.4.5 X3DField::isReadable
    public_symbol: x3d::sai::experimental::scene_snapshot::readable
    support: partial
    tests: [sai_field_readable]
    binding_obligations: [CPP-A.4.5-FIELD-CAPABILITY]
    preserves: [INV-FIELD-1, INV-FIELD-3, INV-FIELD-5]
  - <<: *query
    id: SVC-FIELD-WRITABLE
    clause: ISO/IEC 19777-4, Annex A.4.5 X3DField::isWritable
