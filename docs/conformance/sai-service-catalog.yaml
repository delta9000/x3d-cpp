# Independent completeness oracle for the abstract SAI service inventory.
# Names and clauses are transcribed from the official ISO/IEC 19775-2:2015
# (X3D 3.3) Clause 6 table of contents. Do not derive this list from x3d-cpp.
schema_version: 1
standard: ISO/IEC 19775-2:2015
source_url: https://www.web3d.org/documents/specifications/19775-2/V3.3/Part02/servRef.html
reviewed: "2026-07-18"

# Language-binding-only semantics are tracked independently from the abstract
# service clauses below. This audit deliberately fails closed: `complete` may
# be set only after every normative clause, table, and base interface in Part 4
# has been checked, not merely after these initially identified obligations are
# implemented. Existing CPP-* IDs refer to the historical v3.3 committee draft
# below. They are NOT themselves published 2025 clause numbers. The separate
# published_review map reconciles the existing 16 obligations against the
# Web3D-designated IS copy; whole-standard and implementation audits remain
# incomplete. Keep historical IDs stable for evidence continuity.
cpp_binding:
  standard: ISO/IEC 19777-4 v3.3 committee draft (historical catalog source)
  source_url: https://www.web3d.org/specifications/ISO-IEC19777/ISO-IEC19777-4v3.3-CD/Part04/concepts.html
  source_status: historical_committee_draft
  reviewed: "2026-07-18"
  audit_status: incomplete
  current_published_standard:
    standard: ISO/IEC 19777-4:2025
    source_url: https://www.iso.org/standard/83753.html
    publication_date: "2025-02"
    reference_verified: "2026-10-07"
    clause_mapping_status: partial
    text_source_url: https://www.web3d.org/specifications/X3Dv4/ISO-IEC19777-4v3.3-IS/Part04/X3D_CPP.html
    text_source_status: official_web3d_designated_IS_copy
    designation_source_url: https://www.web3d.org/new/node/2762
    iso_master_byte_equivalence: not_verified
    reconciliation_scope: existing_16_obligations_only
  obligations:
    CPP-4.3.1.2-CALLBACK-ROBUSTNESS: User exceptions outside Script initialization do not terminate browser execution.
    CPP-4.3.2.2-SESSION-EQUIVALENCE: Browser services have the same semantics regardless of how the browser reference was obtained.
    CPP-4.3.3.1-NODE-USER-DATA: User data follows semantic node identity and is visible through every reference to that node.
    CPP-4.3.3.1-FIELD-USER-DATA: User data follows semantic field identity and survives disposal of an individual external reference while the field remains live.
    CPP-4.3.4-RELATIVE-URLS: Relative URL resolution has an explicit application or remote-session base policy.
    CPP-4.3.5.1-NULL-NODES: A null C++ node handle maps to X3D NULL for SFNode reads and writes.
    CPP-4.3.5.2-EXTERNAL-MF-EVENTS: External MF edits aggregate under update control and otherwise publish one event per write.
    CPP-4.3.5.3-MFNODE-NULL-ORDER: MFNode preserves null elements and their original positions.
    CPP-4.3.5.4-MFIELD-ARRAYS: Empty MF values are size-zero ranges and null is not accepted as an array value.
    CPP-4.3.5.5-SET1VALUE: Indexed MF writes obey the host-specific aggregation and last-write rules.
    CPP-4.3.6-DISPOSAL: Explicit disposal invalidates the disposed entity handle and later access fails predictably.
    CPP-A.4.4-FIELD-DEFINITION: Field definitions expose stable name, access, numeric type, and type-name metadata.
    CPP-A.4.5-FIELD-CAPABILITY: Field readability and writability reflect the current lifecycle phase.
    CPP-A.4.5-FIELD-OBSERVATION: Field subscriptions can be added and removed without corrupting event delivery.
    CPP-A.4.6-MFIELD-EDITING: Multi-fields expose size, clear, and indexed removal with defined bounds behavior.
    CPP-A.4.48-MFNODE-EDITING: MFNode exposes whole-range, indexed, append, and insert operations without losing node identity.

  published_review:
    CPP-4.3.1.2-CALLBACK-ROBUSTNESS:
      clause: 4.3.1.3
      source_url: https://www.web3d.org/specifications/X3Dv4/ISO-IEC19777-4v3.3-IS/Part04/concepts.html#RobustnessAndErrorHandling
      status: changed
      assessment: Retained behavior; initialization remains exceptional. Stable ID keeps historical numbering.
    CPP-4.3.2.2-SESSION-EQUIVALENCE:
      clause: 4.3.1.1
      source_url: https://www.web3d.org/specifications/X3Dv4/ISO-IEC19777-4v3.3-IS/Part04/concepts.html#LBConceptsOverview
      status: changed
      assessment: Equivalence appears in 4.3.1.1; 4.3.2.2 concerns component creation.
    CPP-4.3.3.1-NODE-USER-DATA:
      clause: 4.3.3.1
      source_url: https://www.web3d.org/specifications/X3Dv4/ISO-IEC19777-4v3.3-IS/Part04/concepts.html#DataStorage
      status: match
      assessment: Node association retained; Annex A node signatures need separate completeness review.
    CPP-4.3.3.1-FIELD-USER-DATA:
      clause: 4.3.3.1
      source_url: https://www.web3d.org/specifications/X3Dv4/ISO-IEC19777-4v3.3-IS/Part04/concepts.html#DataStorage
      status: match
      assessment: Field association retained; release when entirely unreferenced is permitted.
    CPP-4.3.4-RELATIVE-URLS:
      clause: 4.3.4.2
      source_url: https://www.web3d.org/specifications/X3Dv4/ISO-IEC19777-4v3.3-IS/Part04/concepts.html#C++Applications
      status: needs-decision
      assessment: Source retains Windows-specific base resolution; generic or remote policy needs explicit deviation.
    CPP-4.3.5.1-NULL-NODES:
      clause: 4.3.5.1
      source_url: https://www.web3d.org/specifications/X3Dv4/ISO-IEC19777-4v3.3-IS/Part04/concepts.html#NULLNodes
      status: match
      assessment: Retained; map modern empty handles explicitly.
    CPP-4.3.5.2-EXTERNAL-MF-EVENTS:
      clause: 4.3.5.2
      source_url: https://www.web3d.org/specifications/X3Dv4/ISO-IEC19777-4v3.3-IS/Part04/concepts.html#ExternalInteractions
      status: match
      assessment: Retained aggregation and last-write behavior.
    CPP-4.3.5.3-MFNODE-NULL-ORDER:
      clause: 4.3.5.3
      source_url: https://www.web3d.org/specifications/X3Dv4/ISO-IEC19777-4v3.3-IS/Part04/concepts.html#SettingMFNodeFields
      status: match
      assessment: Retained ordering, including null entries.
    CPP-4.3.5.4-MFIELD-ARRAYS:
      clause: 4.3.5.4
      source_url: https://www.web3d.org/specifications/X3Dv4/ISO-IEC19777-4v3.3-IS/Part04/concepts.html#ArrayRepresentation
      status: match
      assessment: Retained; IllegalArgumentException requires an explicit modern error mapping.
    CPP-4.3.5.5-SET1VALUE:
      clause: 4.3.5.5.1–4.3.5.5.3
      source_url: https://www.web3d.org/specifications/X3Dv4/ISO-IEC19777-4v3.3-IS/Part04/concepts.html#Set1Value
      status: match
      assessment: Retained; internal and external execution models both need coverage.
    CPP-4.3.6-DISPOSAL:
      clause: 4.3.6
      source_url: https://www.web3d.org/specifications/X3Dv4/ISO-IEC19777-4v3.3-IS/Part04/concepts.html#DisposingOfResources
      status: needs-decision
      assessment: Handle-only wording is insufficient; reconcile node invalidation and InvalidNodeException.
    CPP-A.4.4-FIELD-DEFINITION:
      clause: A.4.4
      source_url: https://www.web3d.org/specifications/X3Dv4/ISO-IEC19777-4v3.3-IS/Part04/abstracts.html#X3DFieldDefinition
      status: match
      assessment: Numeric access/type and textual type metadata signatures remain normative.
    CPP-A.4.5-FIELD-CAPABILITY:
      clause: A.4.5
      source_url: https://www.web3d.org/specifications/X3Dv4/ISO-IEC19777-4v3.3-IS/Part04/abstracts.html#X3DField
      status: match
      assessment: Capability-query signatures retained; lifecycle semantics also require abstract-SAI mapping.
    CPP-A.4.5-FIELD-OBSERVATION:
      clause: A.4.5
      source_url: https://www.web3d.org/specifications/X3Dv4/ISO-IEC19777-4v3.3-IS/Part04/abstracts.html#X3DField
      status: match
      assessment: Listener-add/remove signatures retained; event correctness requires services/execution-model evidence.
    CPP-A.4.6-MFIELD-EDITING:
      clause: A.4.6
      source_url: https://www.web3d.org/specifications/X3Dv4/ISO-IEC19777-4v3.3-IS/Part04/abstracts.html#MField
      status: needs-decision
      assessment: Size, clear, removal retained; this declaration alone does not define bounds errors.
    CPP-A.4.48-MFNODE-EDITING:
      clause: A.4.48
      source_url: https://www.web3d.org/specifications/X3Dv4/ISO-IEC19777-4v3.3-IS/Part04/abstracts.html#MFNode
      status: match
      assessment: Whole/indexed/append/insert signatures retained; identity semantics and malformed declarations need
        separate analysis.

