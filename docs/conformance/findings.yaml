  summary: CPU reference sampler honored only repeat/clamp — MIRRORED_REPEAT and CLAMP_TO_BOUNDARY were ignored and the magnification filter was not applied.
  note: "CPU Texture.hpp consumes all extracted boundary modes and borderColor, magnification and minification filters, generateMipMaps and anisotropy (supported maximum 16). Generated box-filter mip levels use nearest/bilinear selection and nearest/trilinear mip selection; absent mipmaps fall back to the corresponding base-level filter. Derivatives are perspective-correct per UV channel and are recomputed for procedural coordinates. Tests: texture_render_test and interchange_test. Scope is the CPU reference sampler, not the OpenGL PoC. (2026-10-02)"
- id: TXF-1
  nodes: [TextureTransform, Box, Sphere, Cone, Cylinder]
  component: Texturing
  clause: "18.4.10"
  severity: minor
  status: closed
  summary: TextureTransform matrix application order divergence (translate/center/rotate/scale/−center) — UVs transformed incorrectly for non-trivial transforms.
  note: "Order fixed to the normative matrix Tc' = C·S·R·C⁻¹·T·Tc (right-to-left: translate → pivot → ROTATE → SCALE → un-pivot), matching §18.4.10's '(in order)' list — rotation BEFORE scaling. The contradicting prose sentence ('rotation ... after the scaling operation has been applied') is treated as an editorial error. applyTextureTransform + makeTextureTransform3x3 (TextureTransform2D.hpp) now agree; the centre pivot convention is unchanged. Regression: texture_extract_test (testTextureTransformOrder: π/2 about centre (0.5,0.5) + scale (2,3) + translation → (0.1,0.05), plus a make3x3 cross-check). (2026-06-27)"
- id: TXF-2
  nodes: [TextureCoordinateGenerator, IndexedFaceSet, ElevationGrid]
  component: Texturing
  clause: "18.4.8"
  severity: major
  status: fixed
  summary: Both reference hosts implement all eleven TextureCoordinateGenerator modes and transform the generated coordinates.
  note: "CPU unlit, Phong and PBR select coordinates independently for each texture stage and material slot. All eleven Table 18.6 modes consume local/eye positions and normals, noise scale/translation and refraction parameters; generated coordinates receive the matching TextureTransform. Deterministic 3D Perlin noise and refract-based mapping are documented implementation choices where the published table is underspecified. Tests: texcoord_gen_test and interchange_test. The PoC's COORD-EYE fallback and reversed reflection eye vector were fixed for issue #140 and are covered by examples/poc_renderer/tests/texgen_gl_test.py (run by validate-examples). The PoC now evaluates all eleven modes per fragment in shaders/texgen.glsl (the same Perlin hash and refraction as the CPU) for its unlit, Phong and PBR programs, and applies the generated-coordinate TextureTransform; examples/poc_renderer/tests/texgen_local_gl_test.py (run by validate-examples) checks COORD, SPHERE-LOCAL, NOISE, NOISE-EYE, SPHERE-REFLECT and SPHERE-REFLECT-LOCAL samples and a generated-coordinate transform against Table 18.6 in each program (2026-10-10). The PoC's one-generator-per-material limit is REQ-MULTITEXTURE-2."
