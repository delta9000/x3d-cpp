  note: >-
    Do NOT retype MFFloat->SFVec4f (breaks ClassicVRML brackets vs the sfvec4fValue grammar;
    Mantis 1398/1468). Policy (ADR-0030) - keep MFFloat storage; add size==4 normalization
    (FOV_TUPLE_ARITY warning) + min<max ordering check (FOV_EXTENT_ORDER) applied to BOTH nodes;
    add a non-breaking SFVec4f convenience accessor. Sites OrthoViewpoint.hpp:111/177,
    TextureProjectorParallel.hpp:77. Closed 2026-09-26: runtime/X3DRangeValidate.hpp emits
    FOV_TUPLE_ARITY and FOV_EXTENT_ORDER for both nodes and exposes orthoFieldOfView4;
    runtime/parse/tests/range_warnings_test.cpp covers arities 3/5 and ordering.
    4.1 - validated; the 4.1 UOM KEEPS OrthoViewpoint.fieldOfView
    MFFloat (committee declined the retype for the same reason), so validate-don't-retype is correct.
- id: EXTRUSION-SCP
  nodes: [Extrusion]
  clause: "13.3.5.4.5"
  severity: minor
  status: closed
  summary: "2-distinct-point Extrusion spine fixes the SCP plane normal but leaves in-plane X/Z free; single distinct point has no SCP. Browsers diverge (X3DOM Harrier wings reversed)."
  note: >-
    Implemented per ADR-0031 in tessellateExtrusion() (MeshBuilder.cpp): with Y = unit spine tangent,
    the underdetermined Z = normalize(modelZ - (modelZ·Y)Y) (fallback modelX when Y ∥ modelZ), X =
    normalize(Y×Z), re-derive Z = X×Y (replacing the arbitrary ref×Y fallback); and a cull when fewer
    than 2 DISTINCT (coincident-collapsed) spine points (§13.3.5.4.5 sentence 2). Regression:
    mesh_builder_extrusion_scp_test.cpp (coincident 1-point cull; spine-along-+X in-plane axes; Y∥modelZ
    fallback; well-defined bent spine untouched). (2026-06-27)
