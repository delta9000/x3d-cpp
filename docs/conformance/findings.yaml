  nodes: [WorldInfo]
  component: Core
  clause: "7.2.5.3 (profile)"
  severity: minor
  status: closed
  summary: An unknown/misspelled `profile=` token is silently coerced to Interchange and re-emitted as `profile='Interchange'` — validates against the wrong component table and rewrites authored metadata.
  note: >-
    Closed by X3DDocument::setProfileToken (all readers): an unknown token is diagnosed as
    ReaderWarning{Kind::ProfileCoerced} and the authored spelling is preserved in profileRaw so every writer
    round-trips it unchanged (profileToken()). Resolved Profile is still Interchange for profile-fit.
    Regression: x3d_parse_tests core_diagnostics_test (profile_coerce_*).

- id: CONTAINERFIELD-FALSEPOS
  nodes: [Coordinate, NurbsCurve]
  clause: "ISO 19776-1 (containerField)"
  severity: minor
  status: closed
  summary: CONTAINERFIELD_MISMATCH warns whenever containerField != the child's own default, false-positiving on legal non-default overrides (e.g. <NurbsCurve><Coordinate containerField='controlPoint'/></NurbsCurve>).
  note: >-
    Closed by resolving whether the explicit containerField names an SF/MFNode field on the PARENT that
