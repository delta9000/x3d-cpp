- id: DO-CASCADE
  nodes: [Script]
  interfaces: [X3DScriptNode]
  clause: "29.2.6, 4.4.8.3"
  severity: major
  status: closed
  summary: "directOutput cross-node write is injected as a routable cascade seed (19775-1 29.2.6) instead of a non-routable value mutation (SAI 19775-2 4.5.2)."
  note: >-
    19775-1 29.2.6 ("shall be part of the current event cascade") contradicts 19775-2 SAI 4.5.2
    ("generates no event ... not part of the event cascade"); SAI governs the seam and matches the
    x3dom/implementor consensus. Policy (ADR-0029) - SaiContext::setField on another node mutates the
    field via the reflection setter (ctx_.writeField, no postEvent, no ROUTE fan-out); self-writes to the
    Script's own outputOnly field keep the routable postEvent path. Closed 2026-09-26: implemented in
    runtime/script/SaiContext.hpp:96; tested in x3d_sai_context (testDirectOutputGate asserts the direct
    write lands but fans out NO ROUTE, and that a self-write still fans out). 4.1 - unresolved upstream;
    engine adopts the SAI direction ahead of spec.
- id: FOV-TYPE
