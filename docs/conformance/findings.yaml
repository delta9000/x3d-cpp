  component: NURBS
  clause: "27.4"
  severity: major
  status: fixed
  commit: 5ddbe5d
  summary: "NurbsCurve → Lines and NurbsPatchSurface → Triangles now tessellate in extract."
  note: "Resolved for curve + patch by the first-party NURBS math unit runtime/extract/NurbsEval.hpp (Cox–de Boor + rational eval + analytic normals + periodic closed/uClosed/vClosed handling), wired into two MeshBuilder arms; recognizedGeometryType() now returns true for both. Clamped-uniform default knots, control-point convex-hull bounds. The still-deferred trimmed/swept/swung surfaces move to NRB-3. See ADR-0040. (NURBS curve+patch wave 2026-06-27)"
- id: NRB-3
  nodes: [NurbsSweptSurface, NurbsSwungSurface, NurbsTrimmedSurface]
  interfaces: [X3DNurbsSurfaceGeometryNode]
  component: NURBS
  clause: "27.4"
  severity: major
  status: deferred
  summary: "NurbsSweptSurface/NurbsSwungSurface now tessellate in extract; NurbsTrimmedSurface stays absent from recognizedGeometryType()."
  note: "Swept + swung DONE (2026-07): both are recognized and tessellate into the shared patch-surface mesh form (Triangles, per-vertex normals, unit-square texcoords) via NurbsEval.hpp helpers — tessellateCurve2D (an X3DNurbsControlCurveNode lifted to the shared evaluator), sweptSurfaceGrid (cross-section carried in the Frenet-ish frame of the trajectory tangent: a circle swept along a straight line is a cylinder) and swungSurfaceGrid (the classic swung S(u,v)=(px·tx, px·ty, py): a line profile swung around a circle is a surface of revolution). They honor solid/ccw/tessellation like the patch surface, read the profile/cross-section via the control-curve fields (order/knot/weight/closed; ContourPolyline2D forced piecewise-linear order 2), reuse s.weightMode (NRB-4), and gain conservative GeometryBounds arms (trajectory control hull inflated by the cross-section radius; swung by |px|·|t|, z from the profile height). Covered by nurbs_swept_circle_along_line_is_cylinder + nurbs_swung_line_profile_around_circle_revolves + nurbs_swept_swung_recognized_oracle (mesh_builder_nurbs_swept_test.cpp). NurbsTrimmedSurface NOT DONE: it needs 2D contour-loop point-in-region clipping + polygon triangulation in the (u,v) domain, and the codebase has no such helper (MeshBuilder's only triangulators are lattice/strip/fan grid emitters). It remains unrecognized, routes through MeshBuildOptions::externalGeometryResolver, and is the canonical unrecognized specimen in external_geom_seam_test.cpp + scene_extractor_audit_test.cpp. Implementing it is a separate card (add a 2D-constrained-triangulation subsystem first). (NURBS curve+patch wave 2026-06-27; swept/swung 2026-07)"
