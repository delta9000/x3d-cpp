- id: ENC-VRML-STRING
  nodes: [MetadataString]
  interfaces: [X3DMetadataObject]
  clause: "ISO 19776-2 5.3 (sfstringValue/mfstringValue)"
  severity: major
  status: fixed
  commit: 1e3c51d
  summary: ClassicVRML writer does not escape '\"' or '\\' in SFString/MFString/META — embedded quote truncates the value and drops following fields; backslash is eaten and splits one MFString element into two.
  note: >-
    Proven on real corpus ConformanceNist/.../greyscale_jpg_diffuseColor.x3d: a META description
    with an inner quote writes `META "description" "...adding a "red"..."` and re-reads truncated at
    the inner quote, dropping the rest plus the next four <meta> lines. MFString probe: a 5-element
    field with a backslash/quote becomes 6 elements. Fix: VrmlWriter must emit '"'->'\"' and
    '\\'->'\\\\' on every SFString/MFString/META. Affects descriptions, licenses, any string-bearing
    field through a .x3dv hop. (round-trip sweep; confirms an earlier static prediction.)
    CLOSE: by the time of the fix only META still wrote raw (SFString/MFString paths had gained
    vrmlEscapeString/fmtMFString escaping earlier); META name/content now escape too. Regression:
    codec_string_hardening_test (XML -> VRML -> reparse with embedded quote + backslash).

- id: ENC-VRML-SFIMAGE
  nodes: [PixelTexture]
  component: Texturing
  clause: "ISO 19776-2 5.3 (sfimageValue)"
  severity: major
  status: fixed
  commit: 1e3c51d
  summary: ClassicVRML SFImage READER consumes only width and discards height/components/all pixel words — a 2x2 texture parses back as `2 0 0` (empty).
  note: >-
    Real scenes NetworkedCamera.x3d, examples/.../textured_text.x3d:
    `image='2 2 3 0 65280 255 16711680'` survives XML->JSON direct, the .x3dv even WRITES it
    correctly, but reading that .x3dv back yields `[2,0,0]` — every inline PixelTexture destroyed the
    instant the scene passes through ClassicVRML. Fix: the ClassicVRML SFImage parser must consume
    width*height pixel words after the `w h comp` header. (round-trip sweep, newly surfaced.)
    CLOSE: NodeBuilder::collectFieldValue special-cases SFImage (3 header tokens then w*h pixel
    words; hostile headers capped at 2^20 per axis). Regression: codec_string_hardening_test
    (SFImage operator== across the .x3dv hop).

- id: ENC-JSON-UNIT
  nodes: [WorldInfo]
  component: Core
  clause: "ISO 19776-3 (head/unit); 19775-1 7.2.5 UNIT"
  severity: major
  status: fixed
  commit: 1e3c51d
  summary: X3D-JSON writer has no slot for UNIT declarations — <unit> is silently dropped on XML/VRML->JSON, so every angle/length value then means something different with no warning.
  note: >-
    Probe: `<unit category='angle' name='degrees' conversionFactor='0.0174533'/>` survives into
    ClassicVRML (`UNIT angle degrees 0.0174533`) but is absent from the JSON and the round-trip XML.
    JsonReader.hpp:111-119 READS "unit" back, so the asymmetry is the tell. Fix: emit the `unit`
    array in JsonWriter.hpp writeHead, mirroring `meta`. (round-trip sweep, confirms a static prediction.)
    CLOSE: JsonWriter::writeHead emits the unit array in the exact shape JsonReader reads
    ("@category"/"@name"/"@conversionFactor"). Regression: codec_string_hardening_test.

- id: ENC-PROTO-APPINFO
  nodes: [ProtoDeclare, ExternProtoDeclare]
  interfaces: [X3DPrototypeInstance]
  clause: "ISO 19776-2; 19775-1 4.4.4"
  severity: minor
  status: open
  summary: ProtoDeclare/ExternProtoDeclare and field `appinfo`/`documentation` survive XML and JSON, but are not representable in ClassicVRML and are lost on that hop.
  note: >-
    XML and JSON readers/writers preserve declaration and field metadata. Regression:
    proto_appinfo_json_roundtrip_test. ISO/IEC 19776-2 ClassicVRML PROTO/EXTERNPROTO/interface
    syntax has no appinfo or documentation production; comments are not a semantic metadata slot.
    ClassicVRML conversion therefore remains lossy for these attributes.

- id: ENC-PROTO-CONNECT
  nodes: [ProtoBody, connect]
  interfaces: [X3DPrototypeInstance]
  clause: "ISO 19776; 19775-1 4.4.4 (IS/connect)"
  severity: major
  status: closed
  summary: ProtoBody `<connect>` IS-wiring is dropped on round-trip (5 scenes) — the proto declares fine but no longer drives anything inside its body.
  note: >-
    XML, JSON, and ClassicVRML writers emit the body's IS bindings, including nested nodes; matching
    readers restore them. ClassicVRML now emits a type-default value for valueless initializeOnly and
    inputOutput author/interface declarations, so the following IS statement cannot be consumed as a
    value. Regression: proto_is_json_vrml_roundtrip_test and proto_author_field_is_roundtrip_test.
    Corpus checks: CanopyPrototype.x3d 4 -> 4 connects; PajekVisualizationPrototypes.x3d 32 -> 32.

- id: ENC-SFNODE-DEFAULT
  nodes: [ProtoDeclare, field]
  interfaces: [X3DPrototypeInstance]
  clause: "ISO 19776; 19775-1 4.4.4"
  severity: minor
  status: closed
  summary: A proto `<field type='SFNode'>` default child node collapses to empty on round-trip — instances relying on the default get nothing.
  note: >-
    SFNode/MFNode default children are serialized in XML and JSON; ClassicVRML emits an SFNode default
    as a bare node (and MFNode defaults as a list). Regression: proto_sfnode_default_roundtrip_test.

- id: ENC-CDATA-SCRIPT
  nodes: [Script]
  interfaces: [X3DScriptNode]
  clause: "ISO 19776-1 (CDATA); 19775-1 29"
  severity: minor
  status: fixed
  commit: 1e3c51d
  summary: Script source containing the literal `]]>` is silently truncated (`if (a]]>b)` -> `if (ab)`) — the XML writer wraps source in one CDATA block without splitting.
  note: >-
    XmlWriter wraps el.text as `<![CDATA[ + text + ]]>` with no split; a `]]>` in JS source closes the
    CDATA early. Partly an inherent XML limit, but the toolchain neither rejects nor preserves — it
    eats characters. Fix: split on `]]>` into consecutive CDATA sections (`]]]]><![CDATA[>`).
    (encoding review; confirmed by round-trip sweep.)
    CLOSE: xml::cdataEscape (XmlLite) applied by both XmlWriter and CanonicalXmlWriter; XmlLite's
    reader already concatenates consecutive CDATA sections. Regression: codec_string_hardening_test.

- id: ENC-C14N-ATTR
  nodes: [MetadataString]
  component: Core
  clause: "X3D Canonical Form (X3DC14N); W3C C14N attr normalization"
  severity: minor
  status: fixed
  commit: 1e3c51d
  summary: X3DC14N attribute escaping omits tab/newline/CR (`&#x9; &#xA; &#xD;`) — a canonical file with multiline meta/MFString is non-portable (any conformant reader normalizes the raw tab/newline to a space).
  note: >-
    CanonicalXmlWriter canonEscape escapes only `& < > '`. Self-stable here (re-canonicalizing twice is
    identical) but NOT portable/signable across conformant parsers, and likely caps the canon-gate T3
    byte-exact rate. Fix: emit `&#x9;/&#xA;/&#xD;` in attribute values (pure superset for well-formed
    text). (encoding review; confirmed non-portable by round-trip sweep.)
    CLOSE: canonEscape now emits the three character references in attribute values. Regression:
    codec_string_hardening_test (reparse of the canonical form preserves tab/newline/CR).

- id: ENC-MFSTRING-READ
  nodes: [MetadataString]
  component: Core
  clause: "ISO 19776-2 5.3 (mfstringValue)"
  severity: minor
  status: fixed
  commit: 1e3c51d
  summary: MFString reader drops a backslash before any char other than '\"'/'\\' — `\\n`->`n`, `\\t`->`t`, Windows `c:\\new\\tex`->`c:newex`.
  note: >-
    FieldValueIO.hpp:172-177: on `\\` it copies buf[i+1] verbatim and advances 2. ISO 19776 defines
    only `\"` and `\\` as escapes; X_ITE preserves an unknown `\x`. Own write->read is safe (writer
    escapes `\`), but external/hand-authored MFString is mangled. Fix: for any `\x` other than `\"`/`\\`,
    keep the backslash. (encoding review.)
    CLOSE: applied in both unescape sites — FieldValueIO::parseMFString and VrmlTokenizer's string
    lexer (same bug class on the ClassicVRML path). Regression: codec_string_hardening_test.

- id: ENC-JSON-CTRL
  nodes: [MetadataString]
  component: Core
  clause: "ISO 19776-3; RFC 8259"
  severity: minor
  status: fixed
  commit: 1e3c51d
  summary: X3D-JSON writer emits raw control chars (`\\b \\f`, any U+0000–001F) which RFC 8259 forbids; reader passes a lone surrogate through as malformed UTF-8.
  note: >-
    JsonWriter jstr escapes only `" \ \n \t \r`; strict consumers (and X3DJSAIL's JSON path) reject the
    output. Fix: fall through to `\u00XX` for any byte < 0x20; optionally substitute U+FFFD for unpaired
    surrogates on read. (encoding review.)
    CLOSE: jstr escapes U+0000..001F as \u00XX. The optional read-side U+FFFD substitution for
    unpaired surrogates was NOT done (lenient read keeps bytes as-is; revisit only if a consumer
    needs strict UTF-8). Regression: codec_string_hardening_test.

# ══ BEHAVIORAL RUNTIME ══════════════════════════════════════════════════════

- id: SCRIPT-EVENTIN
  nodes: [Script]
  interfaces: [X3DScriptNode]
  clause: "29.2; 4.4.8.3"
  severity: major
  status: fixed
  summary: A ROUTE into a Script inputOnly field now runs the script function of the same name, and a routed inputOutput value reaches the script's variable; before, both stopped in the author-field store and needed embedder wiring.
  note: >-
    deliver() (X3DEventCascade.hpp) falls back to dynamicFieldStore().authorFields() when the static
    table misses, so a routed value (incl. `set_url`) reaches the author field's store entry
    (cascade_author_field_test). The cascade now also notifies author-input listeners after such a
    write, and addScriptSystem registers ScriptSystem::onAuthorInput as one. An inputOnly event goes to
    deliverInputEvent (so mustEvaluate batching and eventsProcessed apply as for any input); an
    inputOutput event updates the script's global through ScriptEngine::updateField, so a later
    readback does not revert the routed value. EMBEDDER NOTE: a browser that polled author-input
    fields after the cascade and called deliverInputEvent itself must drop that bridge, or each event
    runs its handler twice. Tests: script_system (mock), script_corpus_e2e (routed eventIn and
    inputOutput end to end), ecmascript/quickjs backend T15i.

- id: TRANSFORMSENSOR-SCALE
  nodes: [TransformSensor]
  interfaces: [X3DEnvironmentalSensorNode]
  clause: "22.4.5"
  severity: major
  status: closed
  summary: TransformSensor extracts orientation_changed from a scale-bearing relative matrix — a uniform 3x scale collapses the reported angle to 0; non-uniform scale can emit a NaN SFRotation into the route graph.
  note: >-
    TransformSensor now orthonormalizes the relative matrix basis before extracting orientation;
    degenerate zero-scale bases retain the last valid rotation (identity initially). Covered by
    testTransformSensorScaleRotation in view_dependent_test.cpp (uniform and non-uniform scale,
    plus zero scale).

- id: IMPORT-EXPORT-WIRE
  nodes: [IMPORT, EXPORT, Inline]
  clause: "9.4.2; 4.4.6"
  severity: minor
  status: closed
  summary: IMPORT/EXPORT statements parse and round-trip but are never wired to routing — a ROUTE to an imported name hits the unresolved-endpoint drop.
  note: >-
    Closed by wireInlineImports (runtime/InlineExpand.hpp), called from parseDocument after expandInlines:
    each Import{inlineDEF, importedDEF, AS} resolves the imported name against the named Inline's retained
    child scene (its <EXPORT AS> alias first, else a child DEF) and registers the local alias in
    scene.defs before re-running resolveRoutes, so a ROUTE to/from the AS name binds. Regression:
    x3d_parse_tests core_diagnostics_test (import_export_wire_route_to_imported_as_name).

- id: SCRIPT-OUTPUTONLY-REEMIT
  nodes: [Script]
  interfaces: [X3DScriptNode]
  clause: "29.2.4 (ECMAScript binding 19777-1)"
  severity: low
  status: closed
  summary: An explicit same-value assignment to a Script outputOnly field is suppressed — strict X3D semantics say an explicit eventOut assignment generates an event regardless of value.
  note: >-
    EcmaScriptBackend.cpp readbackAuthorGlobals diffed the JS global against the stored value and skipped
    if equal, for BOTH inputOutput (correct) and outputOnly (a re-assert on two ticks fired once). Closed
    2026-09-26: the no-op diff suppression now applies to inputOutput only, in both backends
    (runtime/script/EcmaScriptBackend.cpp, runtime/script/QuickJsBackend.cpp); an outputOnly re-assignment
    always emits. Tested in x3d_ecmascript_backend (T18).

- id: GRP-ADDCHILDREN
  interfaces: [X3DGroupingNode]
  component: Grouping
  clause: "10.2.1"
  severity: major
  status: fixed
  summary: "addChildren / removeChildren events were accepted but never changed children."
  note: >-
    The generated inputOnly handlers only call an embedder callback, which the runtime never
    installed, so the events were inert on every grouping node. The event cascade now applies
    them to any node with an MFNode children field: addChildren appends nodes not already present,
    removeChildren removes the listed nodes, edits apply in delivery order, and a children event
    with the final value follows in the same cascade (dirty tracking, children_changed ROUTEs).
    Tests: cascade_alias_audit_test "addChildren and removeChildren edit children and emit
    children_changed", hanim_motion_test "HAnim grouping nodes apply addChildren and
    removeChildren". (2026-09-27)
- id: ROUTE-IO-ALIAS
  interfaces: [X3DNode]
  component: Core
  clause: "4.4.2.2, 4.4.8.2"
  severity: major
  status: fixed
  summary: "Document ROUTEs using set_zzz / zzz_changed aliases of an inputOutput field were rejected."
  note: >-
    The scene bridge matched ROUTE field names exactly, so any ROUTE to set_rotation,
    set_translation, set_enabled, set_startTime or from zzz_changed was dropped with an
    "unknown field" diagnostic (670 of 1,329 archive files with ROUTEs use such an alias; Leif
    lost 242 routes). detail::findEndpoint now accepts set_zzz on the sink side and zzz_changed on
    the source side for inputOutput fields and registers the route under the canonical name.
    Test: scene_bridge_test testInputOutputAliases. (2026-09-27)
- id: SCRIPT-SAI-ADDROUTE-VALIDATE
  nodes: [Script]
  interfaces: [X3DScriptNode]
  clause: "ISO/IEC 19775-2 (SAI addRoute: INVALID_NODE / INVALID_FIELD); 19775-1 4.4.2.2, 4.3.7"
  severity: minor
  status: fixed
  summary: Browser.addRoute accepted any endpoints — a null node, an unknown field, a non-output source, a non-input sink or mismatched types all went straight into the live route graph.
  note: >-
    SaiContext::addRoute now validates with the same rules as the document-ROUTE bridge (X3DSceneBridge):
    non-null nodes, fields present (set_/_changed aliases resolved), source readable, sink writable,
    identical types. It throws std::invalid_argument, which surfaces as a JS error. deleteRoute rejects
    null nodes. Tests: ecmascript/quickjs backend T15d.

- id: SCRIPT-RUNAWAY-HANG
  nodes: [Script]
  interfaces: [X3DScriptNode]
  clause: "29.2.4 (ECMAScript binding 19777-1)"
  severity: major
  status: fixed
  summary: A Script handler or top level that never returned hung the host; neither engine bounded script run time.
  note: >-
    ScriptEngine::setCallBudget (default 2 s) bounds every entry into script code. Duktape uses its
    exec-timeout check (DUK_USE_EXEC_TIMEOUT_CHECK, local duk_config.h change) and QuickJS uses
    JS_SetInterruptHandler. An interrupted call is logged as a script error and the script stays loaded; a
    catch-and-continue loop cannot outlast it. ADR-0048 (amended). Tests: ecmascript/quickjs backend T15g.

- id: SCRIPT-UNBOUNDED-MEMORY
  nodes: [Script]
  interfaces: [X3DScriptNode]
  clause: "29.2.4 (ECMAScript binding 19777-1)"
  severity: major
  status: fixed
  summary: A Script could allocate without bound and get the host process killed; neither engine capped script memory.
  note: >-
    ScriptEngine::setMemoryLimit (default 256 MiB). Duktape uses a counting allocator per script; QuickJS uses
    JS_SetMemoryLimit on its shared runtime, so there it caps the scripts' combined heap. Past the cap an
    allocation fails and becomes a contained out-of-memory error. ADR-0048 (amended). Tests:
    ecmascript/quickjs backend T15h.

- id: SCRIPT-HOSTILE-VALUE-ABORT
  nodes: [Script]
  interfaces: [X3DScriptNode]
  clause: "29.2.4 (ECMAScript binding 19777-1)"
  severity: major
  status: fixed
  summary: A Script whose author-field value threw while being read back crashed the host process under Duktape, and QuickJS emitted a half-read value.
  note: >-
    The throw could come from a getter, toJSON, a Proxy trap, or a global or handler accessor. Readback ran
    outside any duk_pcall, so Duktape's fatal handler aborted the host. Duktape is now compiled as C++ with
    DUK_USE_CPP_EXCEPTIONS, and every engine entry runs under duk_safe_call. A throw drops that field's event
    and is logged. QuickJS readback now drops the field on a pending exception. ADR-0048 (amended). Tests:
    ecmascript/quickjs backend T15f.

- id: SCRIPT-SFNODE-REFERENCE
  nodes: [Script]
  interfaces: [X3DScriptNode]
  clause: "29.2.4 (ECMAScript binding 19777-1: SFNode is a node reference)"
  severity: major
  status: fixed
  summary: A script's SFNode was a raw pointer rebuilt as a non-owning shared_ptr — an SFNode written into a field could dangle, and under QuickJS a script could forge a handle to an arbitrary address.
  note: >-
    ADR-0048. Handles are per-script NodeHandleTable ids (Duktape hidden symbol / QuickJS class opaque)
    that resolve to the node's owning shared_ptr, or to null for unknown ids and destroyed nodes. A script
    SFNode output shares ownership like DEF/USE. Tests: ecmascript/quickjs backend T15b-c.

