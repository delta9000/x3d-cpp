- id: DIAG-UNKNOWN-NODE
  nodes: [WorldInfo]
  component: Core
  clause: "ISO 19776-1; 19775-1 7"
  severity: minor
  status: closed
  summary: 'An unknown/misspelled node element is silently discarded with no diagnostic — `x3d validate` reports "valid: yes / no diagnostics" while deleting geometry.'
  note: >-
    Closed by threading a ReaderWarning{Kind::UnknownNode} into X3DDocument.readerWarnings at each reader's
    unknown-element recovery (XmlReader, ClassicVrmlReader, JsonReader) and surfacing it in cmdValidate (and
    the cli-gate validate path) as a "node" diagnostic. Regression: x3d_parse_tests core_diagnostics_test
    (unknown_node_xml/classicvrml/json).

