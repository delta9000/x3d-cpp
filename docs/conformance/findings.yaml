# ── Behavioral-family deferrals (explain the inert nodes) ───────────────────
# These cover whole un-implemented behavioral components so each inert node has a
# tracked reason rather than looking like an unexplained hole.
# ── §16 Sound audit (2026-06-21) — supersedes the blanket CONF-SOUND ────────
# The Sound seam SHIPPED 2026-06-20 (merge efb584f): SoundSystem drives an
# engine-agnostic AudioBackend over the §16 `children` audio graph. The shipped
# scope is the synthesis chain OscillatorSource -> BiquadFilter -> Gain ->
# AudioDestination (frequency/detune/gain/qualityFactor read + route-animated
# each tick; BiquadFilter.type read once at construction but not pushed per-tick
# — the seam's Param enum has no FilterType entry). Audited node-by-node against
# sound.md §16: the chain works but ignores the per-node enabled flag + the
# X3DTimeDependentNode lifecycle, and the rest of the component (spatialization,
# other sources/processing, channels) is not built. Findings SND-1..SND-9 below
# replace CONF-SOUND.
- id: SND-1
  nodes: [OscillatorSource, Gain, BiquadFilter]
  interfaces: [X3DSoundSourceNode, X3DSoundProcessingNode]
  component: Sound
  clause: "16.4.12, 16.4.15, 16.4.4"
  severity: major
  status: fixed
  summary: Both backends honor enabled and the time lifecycle for all wired nodes; a disabled BiquadFilter passes its input through on each backend.
  note: SoundSystem pushes `enabled` (and the time lifecycle's PlaybackState) per tick. BuiltinDspBackend silences a disabled/inactive source and passes a disabled or inactive-off BiquadFilter/Gain through unchanged. MiniaudioBackend silences a disabled OscillatorSource (waveform amplitude 0) and mixes a disabled Gain to unity via its splitter bus volume; a BiquadFilter is now wrapped in a ma_splitter_node whose bus 0 feeds the filter (wet) and bus 1 bypasses it (dry), so Enabled/PlaybackState toggle the two output-bus volumes live and a disabled BiquadFilter passes its input through unchanged. Covered by sound_system_test and swap-test F6 (disabled oscillator, disabled Gain, and now a disabled BiquadFilter on both backends).
- id: SND-2
  nodes: [OscillatorSource, Gain, BiquadFilter]
  interfaces: [X3DTimeDependentNode]
  component: Sound
  clause: "8.2.4.1, 16.4.15"
  severity: major
  status: closed
  summary: Sound sources and processing nodes now run the shared start/stop/pause/resume lifecycle and emit isActive/isPaused/elapsedTime.
  note: SoundTimeSystem reuses X3DTimeDependentSystem and is registered by attachStandardRuntime; SoundSystem gates source and processor output from isActive/isPaused. MediaTimeSystem continues to handle AudioClip and BufferAudioSource. Covered by sound_system_test and standard_runtime_test.
- id: SND-3
  nodes: [SpatialSound, ListenerPointSource]
  component: Sound
  clause: "16.4.16, 16.4.13"
  severity: major
  status: deferred
  summary: "Spatialization PARTIAL — SpatialSound/ListenerPointSource equal-power pan + three DistanceModel modes proven via swap-test (ADR-0026); the §16.4.17 Sound ellipsoid now ships (ADR-0050); HRTF (SpatialSound.enableHRTF) and Doppler (dopplerEnabled) still deferred."
  note: "The classic Sound node's ellipsoid (minFront/maxFront/minBack/maxBack, direction, intensity, spatialize) crosses the seam as geometry via DistanceModel::Ellipsoid and both backends evaluate it (swap-test F4, sound_immersive_test), so Sound is off this finding. SoundSystem wires SpatialSound+ListenerPointSource through a Panner node; equal-power pan (BuiltinDsp) and ma_spatializer (MiniaudioBackend) agree on structural spatial invariants (ear-sign, symmetry, monotonic distance falloff over Linear/Inverse/Exponential). NOT proven: HRTF (no second reference HRTF renderer), Doppler. Those remain deferred to v2. See ADR-0026 scope-honesty section. Replacing the ellipsoid attenuation model with a simpler spherical/OpenAL-aligned model, and adding HRTF, have been recurring, long-standing priorities in X3D audio discussion — not a novel or low-priority ask — worth weighting accordingly when scheduling v2."
- id: SND-4
  nodes: [BufferAudioSource, StreamAudioSource, MicrophoneSource]
  interfaces: [X3DSoundSourceNode]
  component: Sound
  clause: "16.4.5, 16.4.20, 16.4.14"
  severity: major
  status: deferred
  summary: "Audio source breadth PARTIAL — OscillatorSource, AudioClip and BufferAudioSource are built; StreamAudioSource and MicrophoneSource subtrees are still skipped (buildChild returns early; they need a streaming/capture contract)."
  note: "AudioClip ships (ADR-0050): url fetched through the AssetResolver oracle (AssetKind::Audio, Pending retried), decoded by an injected AudioDecoder (reference WAV decoder in runtime/io/wav/), played as a Buffer node holding decoded mono PCM; duration_changed posted; not read: AudioClip.description. BufferAudioSource ships (§16.4.5) through the same Buffer node: the authored buffer MFFloat IS PCM and crosses the seam as mono — a numberOfChannels > 1 buffer is read as interleaved frames and averaged down (the WAV decoder's downmix policy); bufferDuration limits the seconds used (0 = the whole buffer); sampleRate resamples, 0 (spec: the context rate) falling back to 44100 Hz like MiniaudioBackend's clamp; gain scales output; playbackRate x detune (computedPlaybackRate) is captured at activation like AudioClip.pitch — reversed (negative) playback is not modeled; loop rides the MediaTimeSystem lifecycle (TDN-5: startTime/stopTime/pauseTime/resumeTime -> isActive/isPaused/elapsedTime), an unknowable duration (no authored sampleRate) playing until stopTime. NOT read on BufferAudioSource: loopStart/loopEnd (the Buffer node wraps the whole buffer; a loop region needs a seam extension), the X3DUrlObject url/description (audio comes from the buffer field), the length output. StreamAudioSource and MicrophoneSource remain deferred to v2. Covered by sound_immersive_test."
- id: SND-5
  nodes: [Analyser, Convolver, DynamicsCompressor, WaveShaper]
  interfaces: [X3DSoundProcessingNode]
  component: Sound
  clause: "16.4.1, 16.4.6, 16.4.7, 16.4.9, 16.4.21"
  severity: minor
  status: deferred
  summary: Sound-processing breadth — Gain, BiquadFilter, Delay, DynamicsCompressor and WaveShaper are built; Analyser/Convolver subtrees are skipped.
  note: "Delay (§16.4.6) ships on the built-in backend: SoundSystem builds a NodeKind::Delay node and pushes delayTime/maxDelayTime/enabled; BuiltinDspBackend applies a ring-buffer delay, delayTime clamped to [0, maxDelayTime], and enabled=false passes input through (sound_delay_test). DynamicsCompressor ships (§16.4.9): SoundSystem builds it as NodeKind::Compressor (threshold/knee/ratio/attack/release/gain/enabled pushed at build and re-read each tick) and BuiltinDspBackend implements a feed-forward compressor — a dB-domain gain computer with a soft knee and one-pole attack/release smoothing; enabled=false passes the input through (x3d_sound_dynamics). Both are BuiltinDspBackend-only: MiniaudioBackend has no comparable node types (Delay has no NodeKind there; its ma_node graph has no compressor), so they degrade to dropped connections there (the swap test does not use them). reduction is outputOnly and the AudioBackend seam has no per-node metering path (createNode/connect/setParam/render only), so it is not posted. WaveShaper (§16.4.21) also ships: SoundSystem builds a NodeKind::WaveShaper node reading curve/gain/enabled (the transfer curve crosses the seam once, like a Buffer's samples); BuiltinDspBackend maps input x in [-1,1] through the curve with linear interpolation (Web Audio semantics, index = (N-1)/2*(x+1); out-of-range input clamps to the first/last curve value; an empty curve and enabled=false pass the input through; the processing-node gain multiplies the shaped signal) — sound_waveshaper_test. oversample is NONE-semantics only: the field is not carried across the seam, so 2x/4x is ignored (deferred). WaveShaper.curve is defined by ISO/IEC 19775-1 §16.4.21 but absent from the vendored X3D 4.0 UOM; it is supplied by the cited FIELD_ADDITIONS overlay (src/x3d_cpp_gen/conformance/errata.py, tracked in UOM-SND-1), not by editing the vendored data. WaveShaper is BuiltinDspBackend-only (MiniaudioBackend has no WaveShaper kind). Analyser/Convolver remain deferred; each is a clean AudioBackend extension point (add a NodeKind + DSP in the backend .cpp). No new seam needed."
- id: SND-6
  nodes: [ChannelMerger, ChannelSelector, ChannelSplitter]
  interfaces: [X3DSoundChannelNode]
  component: Sound
  clause: "16.4.10, 16.4.11, 16.4.8"
  severity: minor
  status: deferred
  summary: "Channels + multi-channel PARTIALLY UNBLOCKED — stereo render path (renderStereo) landed (ADR-0026); ChannelMerger/Selector/Splitter still not built; channelCount/channelCountMode/channelInterpretation still ignored."
  note: "The AudioBackend now has renderStereo() proven via the swap-test (both backends render stereo output for Panner nodes). The stereo path is the seam prerequisite for multi-channel; the ChannelMerger/Selector/Splitter nodes and channel-aware routing still require dedicated NodeKinds and a channel-count-aware buffer contract. Deferred. Multi-channel routing has moved beyond a speculative extension: it was an actively-proposed X3D4 spec feature with competing routing-node proposals, and at least one working prototype implementation has demonstrated SFInt32 routing on both source and destination sides plus connect/disconnect handling — concrete precedent for the buffer-contract shape this seam will eventually need."
- id: SND-7
  nodes: [AudioDestination, StreamAudioDestination]
  component: Sound
  clause: "16.4.3, 16.4.19"
  severity: minor
  status: closed
  summary: AudioDestination.gain applied; maxChannelCount remains read but unused (mono); StreamAudioDestination not built.
  note: SoundSystem pushes AudioDestination.gain to the backend destination. sound_system_test verifies output scaling. maxChannelCount remains read but unused by mono render, and StreamAudioDestination remains unbuilt.
- id: SND-8
  nodes: [Gain, BiquadFilter]
  interfaces: [X3DSoundProcessingNode]
  component: Sound
  clause: "16.4.12, 16.4.4"
  severity: minor
  status: deferred
  summary: tailTime ignored on processing nodes — a stopped Gain/BiquadFilter does not continue emitting for tailTime seconds.
  note: Tied to the missing activation lifecycle (SND-2); the backend renders steady-state with no stop edge to tail from. Resolve alongside SND-2.
- id: SND-9
  nodes: [OscillatorSource, PeriodicWave]
  component: Sound
  clause: "16.4.15, 16.4.18"
  severity: minor
  status: deferred
  summary: periodicWave stays unread from parsed scenes (the 4.0 bindings predate the 4.1 field) — a registered PeriodicWave is realized on BuiltinDspBackend; MiniaudioBackend falls back to sine.
  note: "Wired: the seam carries Waveform::Custom + optionsReal/optionsImag harmonic terms (cross once at createNode, like Buffer PCM, ADR-0050 precedent); BuiltinDspBackend sums harmonics k=1..N-1 (index 0 = DC, ignored) normalized to peak absolute value 1 (Web Audio default; X3D 4.0's PeriodicWave has no disableNormalization toggle); SoundSystem::setPeriodicWave(osc, wave) registers a PeriodicWave node before attach — standard types map onto the Waveform enum, CUSTOM with no terms falls back to sine. Ignored: the authored OscillatorSource.periodicWave field. The generated bindings model X3D 4.0, where OscillatorSource has no periodicWave field (added in 4.1); PeriodicWave itself exists in 4.0 (type/optionsReal/optionsImag). A parsed <PeriodicWave containerField='periodicWave'/> child parks in the parser's IS fallback slot and findField(osc, 'periodicWave') is null — pinned by x3d_sound_periodicwave (parse tier). Becomes readable when the bindings move to 4.1; until then the embedder registers the wave. MiniaudioBackend's ma_waveform has no custom-table type, so registered waves play as sine there."
- id: UOM-SND-1
  nodes: [WaveShaper, Sound, StreamAudioSource, Delay, StreamAudioDestination, ChannelSplitter, ListenerPointSource]
  component: Sound
  clause: "16.4"
  severity: minor
  status: open
  summary: The vendored X3D 4.0 UOM disagrees with the published ISO/IEC 19775-1 Sound field tables on several nodes; only WaveShaper.curve is corrected so far.
  note: 'Compared field-by-field against the ISO/IEC 19775-1 v4.0 sound.html field tables (2026-09-29; a quick parser that could not read Analyser, AudioClip, BufferAudioSource, OscillatorSource or SpatialSound, so those five are UNCHECKED). WaveShaper.curve (MFFloat inputOutput) is defined by the standard (16.4.21) but absent from the UOM; it is added by the cited FIELD_ADDITIONS overlay in src/x3d_cpp_gen/conformance/errata.py (in-memory, guarded, self-disabling; the vendored XML and committed manifests are untouched) and is what gives the generated WaveShaper getCurve/setCurve. Still open and not yet judged (direction unknown: the ISO text or the UOM may be the erroneous side): Sound has `children` in the standard and `spatialize` in the UOM only; StreamAudioSource lacks `channelCount`; Delay and StreamAudioDestination carry UOM-only `tailTime` / `isActive`; streamIdentifier is MFString in the standard but SFString in the UOM (StreamAudioSource, StreamAudioDestination); ChannelSplitter.children is SFNode in the standard but MFNode in the UOM; ListenerPointSource.gain is SFInt32 in the standard (almost certainly an editorial typo) but SFFloat in the UOM. Next: finish the comparison for the five unchecked nodes and the other components, then add each proven omission to FIELD_ADDITIONS with a citation and report it to Web3D.'
