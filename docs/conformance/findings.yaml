# ── §37 RigidBodyPhysics — a simulation runtime SHIPS (seam + flag-gated Jolt:
#    Box/Sphere, gravity, collision RESPONSE, Ball/SingleAxisHinge/Slider joints,
#    pose route-out). It is PARTIAL: the findings below enumerate every §37 node /
#    RigidBody / RigidBodyCollection field that is read-but-ignored or unsupported.
#    See docs/wiki/subsystems/physics.md "§37 field & node coverage" for the matrix.
- id: CONF-RBP
  component: RigidBodyPhysics
  nodes: [CollisionSensor, Contact, CollisionCollection, CollisionSpace]
  clause: "37"
  severity: major
  status: fixed
  commit: bde5134
  summary: "CollisionSensor reports collisions: contacts (Contact nodes), intersections, and isActive are emitted from the watched CollisionCollection's collidables (§37.4.4-.4.7)."
  note: "Read-only output bridge (the solver already resolves contacts; §37.4.5 forbids feeding them back). PhysicsBackend.drainContacts pull seam + Jolt ContactListener; ContactReporter builds Contact nodes (geometry from the engine, response fields from the CollisionCollection defaults) and emits over the cascade. Deterministic ordering via stable enrolment ordinals. Deferred refinements: one Contact per body-pair per frame (not per manifold point); space-vs-space broadphase grouping (folded into CONF-RBP-GEOM)."
- id: CONF-RBP-FORCES
  component: RigidBodyPhysics
  nodes: [RigidBody]
  clause: "37"
  severity: major
  status: fixed
  commit: 9560686
  summary: "RigidBody.forces/.torques are applied every frame (§37.4.10 continuous-force model) via the new seam method applyForce."
  note: "PhysicsSystem sums forces+torques and applies the resultant before each substep. TDD — zero-g body under 10 N reaches y=4.997 after 1 s (analytic 5)."
- id: CONF-RBP-GEOM
  component: RigidBodyPhysics
  nodes: [CollidableShape, CollidableOffset]
  clause: "37"
  severity: minor
  status: deferred
  summary: "Box/Sphere/Cylinder (exact) + Cone (analytic AABB) collidables are supported; non-analytic meshes (IndexedFaceSet etc.) still exclude the body. CollidableOffset is unhandled; only the first CollidableShape per body is used (no compound)."
  note: As of 68eb39b Cylinder/Cone enroll; the mesh exclusion is OBSERVABLE via droppedBodyCount() (was silent). Remaining closure = a mesh/convex-hull shape path + CollidableOffset transform + compound shapes.
- id: CONF-RBP-JOINTS
  component: RigidBodyPhysics
  nodes: [DoubleAxisHingeJoint, MotorJoint, UniversalJoint]
  clause: "37"
  severity: major
  status: deferred
  summary: "Compound joints are unsupported (only BallJoint/SingleAxisHingeJoint/SliderJoint map to constraints); DoubleAxisHingeJoint/MotorJoint/UniversalJoint are skipped with a note."
  note: The seam (ConstraintDesc + addConstraint) is extensible — add a Kind per joint. No motor drive on the hinge either.
- id: CONF-RBP-JOINT-OUT
  component: RigidBodyPhysics
  nodes: [BallJoint, SingleAxisHingeJoint, SliderJoint]
  clause: "37"
  severity: minor
  status: deferred
  summary: "Joint output events are never produced (angle/separation/*Rate/body*AnchorPoint *_changed), and joint sub-fields stopBounce/stopErrorCorrection are ignored."
  note: Constraints drive motion but report nothing back to the scene. Needs a per-tick joint-state readback mirroring the body pose readback.
- id: CONF-RBP-DAMP
  component: RigidBodyPhysics
  nodes: [RigidBody, RigidBodyCollection]
  clause: "37"
  severity: low
  status: deferred
  summary: "Sleeping/auto-disable fields are now honored as far as Jolt allows. RigidBody.autoDisable -> per-body Jolt allow-sleeping; RigidBodyCollection.autoDisable -> world PhysicsSettings.mAllowSleeping; collection disableTime -> mTimeBeforeSleep; collection disableLinearSpeed -> mPointVelocitySleepThreshold. Still ignored: disableAngularSpeed (Jolt has no separate angular sleep threshold) and the per-body RigidBody.disableTime/disableLinearSpeed (Jolt's thresholds are world-wide)."
  note: "Mapping rule: one RigidBodyCollection owns one Jolt PhysicsSystem, so the collection's world-wide sleep thresholds apply to the whole world, and its autoDisable gates it; the per-body toggle is RigidBody.autoDisable (Jolt has no per-body threshold setter). The §37 default autoDisable=FALSE therefore leaves every enrolled body permanently awake (Jolt mAllowSleeping=false AND per-body allow-sleeping=false) — the §37-correct reading of 'autoDisable toggles operation of disable*' (Jolt previously slept bodies with its own defaults). Default-numeric preservation: a zero disableTime/disableLinearSpeed leaves Jolt's own 0.5 s / 0.03 m/s untouched. The sleeping state is now observable to the runtime via PhysicsBackend::isBodyActive (exposed as PhysicsSystem::isBodyActive); NO new output events were added (the seam has no enabled/isEnabled output hook). autoDamp + linear/angularDampingFactor remain honored (force = -factor·velocity, §37.4.10)."
- id: CONF-RBP-HINGE-LIMITS
  component: RigidBodyPhysics
  nodes: [SingleAxisHingeJoint]
  clause: "37"
  severity: minor
  status: fixed
  summary: "SingleAxisHingeJoint minAngle/maxAngle are honored with the correct sign. §37 limits are measured from the initial pose (valid range minAngle<=0<=maxAngle, <=pi each way) — exactly Jolt's hinge convention. Spec-valid ranges, including asymmetric ones, are honored; out-of-domain/malformed limits are clamped to the valid domain + warned."
  note: "Jolt's hinge angle is the NEGATIVE of the body's rotation about the axis, so the authored limits are negated before being handed to Jolt ([lo,hi] -> [-hi,-lo]); a TDD asymmetric-limit test caught a latent sign bug that symmetric ranges (the default -pi..pi and the locked 0,0) had hidden. A zero-width (locked) range is widened by a 1e-4 gap (Jolt asserts on min==max). Out-of-domain input (initial pose outside the limits, |angle|>pi) is malformed per §37 and clamped + warned. stopBounce / stopErrorCorrection (limit softness/overshoot) remain deferred under CONF-RBP-SOLVER."
- id: CONF-RBP-INERTIA
  component: RigidBodyPhysics
  nodes: [RigidBody]
  clause: "37"
  severity: minor
  status: deferred
  summary: "inertia (explicit tensor) + centerOfMass are now HONORED (Jolt MassAndInertiaProvided + OffsetCenterOfMassShape; non-default detection). Remaining: massDensityModel, finiteRotationAxis/useFiniteRotation."
  note: "inertia/centerOfMass shipped 3a9595c: non-identity inertia → authored 3x3 tensor; non-zero centerOfMass → COM-offset shape wrap; pose readback uses the body origin (GetPosition) so RigidBody.position tracks the authored reference point. Verified by the quadcopter sim (authored inertia governs roll, differs from shape-derived) + a COM-orbit test. Still derived/ignored: massDensityModel (alt mass shape), finiteRotation (integrator option)."
- id: CONF-RBP-SOLVER
  component: RigidBodyPhysics
  nodes: [RigidBodyCollection]
  clause: "37"
  severity: minor
  status: deferred
  summary: "RigidBodyCollection solver tuning is now WIRED for iterations -> Jolt velocity-solver steps, errorCorrection -> Baumgarte, contactSurfaceThickness -> penetration slop, maxCorrectionSpeed -> max penetration distance (each applied only when authored off the §37 default, so spec-default behavior is unchanged). constantForceMix and preferAccuracy remain IGNORED (no honest Jolt equivalent); autoDisable and the sleep thresholds are wired separately (CONF-RBP-DAMP)."
  note: "Seam: PhysicsBackend::setSolverSettings(SolverSettings) (appended after the existing methods) + JoltBackend override reading GetPhysicsSettings/SetPhysicsSettings. PhysicsSystem::attach sends a field ONLY when it differs from RigidBodyCollection::getDefault*(  ), so at the §37 defaults every field is a sentinel and Jolt's own settings are left untouched. Honest mappings only: iterations->mNumVelocitySteps (Jolt default 10 == §37 default 10); errorCorrection->mBaumgarte (both are the [0,1] fraction of position error corrected per update); contactSurfaceThickness->mPenetrationSlop (both are the allowed post-contact interpenetration, m); maxCorrectionSpeed->mMaxPenetrationDistance (closest real cap on position-error correction — caveat: Jolt's value is a per-iteration DISTANCE (m), §37's is a SPEED (m/s)). NOT mapped (no honest equivalent): constantForceMix (Jolt has no constant-force-mix/softness knob); preferAccuracy (a performance hint, no boolean accuracy dial); Jolt's mSpeculativeContactDistance is a pre-contact speculative-detection radius, NOT post-contact interpenetration, so contactSurfaceThickness does not set it; mNumPositionSteps is left at Jolt's default (the §37 iterations field maps to the velocity solver only, so mapping it to the position solver too would change spec-default behavior). The Jolt mapping compiles and the Jolt/physics-system suites pass against real Jolt v5.5.0 with the solver settings applied (host build, -DX3D_CPP_BUILD_PHYSICS=ON), but no test reads Jolt's PhysicsSettings back to assert the applied values: the seam hand-off is asserted by runtime/physics/tests/physics_solver_settings_test.cpp (engine-agnostic recording fake)."
- id: CONF-RBP-CAP
  component: RigidBodyPhysics
  nodes: [RigidBodyCollection]
  clause: "37"
  severity: low
  status: deferred
  summary: "1024 body/pair/contact cap per world (overflow now WARNS, no longer a silent drop — 97d8a5c); raising the value needs a larger temp allocator. A single collision substep per Update can still let fast bodies tunnel."
  note: Co-size the TempAllocator with the cap to raise it; raise the collision substep count for high-velocity scenes.
- id: CONF-RBP-DETERMINISM
  component: RigidBodyPhysics
  nodes: [RigidBodyCollection]
  clause: "37"
  severity: low
  status: fixed
  commit: 97d8a5c
  summary: "Determinism is now host-INDEPENDENT — JoltBackend defaults to a single-threaded deterministic job system (identical results regardless of CPU core count)."
  note: A JoltBackend(workerThreads>0) opts into a thread pool for large scenes (then deterministic only for a fixed count). Single-body sim golden unchanged.
- id: CONF-RBP-ENABLED
  component: RigidBodyPhysics
  nodes: [RigidBody]
  clause: "37"
  severity: major
  status: fixed
  commit: 75a7878
  summary: "RigidBody.enabled was ignored — a body with enabled=FALSE was still simulated. Now excluded from the calculations per §37."
  note: Fixed under TDD in x3d_physics_system (disabled body not enrolled, does not fall).
- id: CONF-RBP-FRICTION-BOUNCE
  component: RigidBodyPhysics
  nodes: [CollisionCollection]
  clause: "37"
  severity: minor
  status: closed
  commit: e038494
  summary: "CollisionCollection.frictionCoefficients (scalar, .x) and bounce are applied as per-contact combined friction/restitution via the Jolt ContactListener, now HONORING appliedParameters: FRICTION_COEFFICIENT-2 gates frictionCoefficients, BOUNCE gates bounce (default [\"BOUNCE\"]). Demonstrated by a rear-wheel-drive vehicle that drives under tyre friction + a rebounding ball."
  note: "PhysicsSystem reads RigidBodyCollection.collider -> CollisionCollection.appliedParameters to gate each param (a selected param overrides the engine default even at value 0; an unselected param leaves the engine default untouched). Scalar friction uses .x (anisotropic .y deferred). Deferred: USER_FRICTION (frictionDirection), anisotropic friction (.y), ERROR_REDUCTION/CONSTANT_FORCE/SPEED-1/2/SLIP-1/2 selectors, slipFactors, surfaceSpeed, minBounceSpeed, softness/solver tuning (CONF-RBP-SOLVER)."

