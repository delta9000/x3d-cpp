# ── Visual conformance sweep (poc renderer vs Web3D/NIST front refs, 2026-06-27) ──
# Surfaced by scripts/visual_conformance_sweep.py: poc `--front` screenshots compared
# against the ConformanceNist `*-front.jpg` references, vision-model scored. Each item
# count below is verified by `poc --headless` on the named scene.
- id: VIS-EXTRUSION-EMPTY
  nodes: [Extrusion]
  component: Geometry3D
  clause: "13.3.5"
  severity: major
  status: fixed
  summary: "Extrusion with default/simple fields extracts NO geometry (render_items=0) — default_extrusion.x3d and test_simpleorient.x3d render blank. FIXED: now render (default_extrusion = unit box, test_simpleorient = oriented square swept along the spine)."
  note: >-
    Root cause was the GENERATOR, not the extractor: the MF-struct default emitter (src/x3d_cpp_gen/emit/defaults.py)
    collapsed any multi-element array default to its FIRST element, so the generated Extrusion binding defaulted
    crossSection to a single point {1,1} and spine to {0,0,0} (instead of the 5-point unit square and the 2-point segment).
    An UNauthored crossSection/spine therefore arrived at tessellateExtrusion as size 1 and was culled by the ns>=2/nc>=2
    guard. Fixed by chunking the flat scalar list into element-sized groups (covered by tests/test_default_expr.py) and
    regenerating Extrusion.hpp; the extractor's .empty() spec-default fallback stays as a safety net, and an AUTHORED
    1-point spine still culls (the documented "< 2 spine points => empty" contract, mesh_builder_b3_test.cpp).
- id: VIS-ELEV-SPACING-EMPTY
  nodes: [ElevationGrid]
  component: Geometry3D
  clause: "13.3.4"
  severity: major
  status: fixed
  summary: "ElevationGrid with non-default xSpacing/zSpacing extracts NO geometry (render_items=0) — test_xSpacing.x3d, test_zSpacing.x3d render blank, while test_color (default spacing) extracts fine. FIXED: both now render 3 grids each."
  note: >-
    Not a spacing bug: test_{x,z}Spacing author only ONE dimension (xDimension=12, height=24 values) and OMIT the other,
    leaving zDimension at its 0 default so the xd>=2 && zd>=2 guard in the ElevationGrid dispatch (MeshBuilder.hpp) zeroed
    the output. Per spec both dimensions are required, but the NIST reference renders expect inference. Fixed by deriving the
    missing dimension from height.size() when it divides evenly by the authored dimension (conservative — only fires when a
    dimension is < 2 and the height array is an exact multiple of the other). Deliberate, documented leniency.
- id: VIS-SPHERE-NOUV
  nodes: [Sphere]
  component: Texturing
  clause: "13.3.6, 18.4.10"
  severity: major
  status: fixed
  summary: "Sphere with an ImageTexture (and NO Material) rendered untextured (flat white) — Geometry/Sphere/texture.x3d. FIXED: the VTS decal now applies (upright, vertically centred per the scene description)."
  note: >-
    Mischaracterized originally: the sphere DOES carry texcoords (tessellateSphere emits them). The real cause is the
    no-Material case — an Appearance with an ImageTexture but no Material is unlit per spec (§12.2.5), so the extractor
    correctly surfaces MaterialModel::Unlit with the image on the EMISSIVE slot (MaterialSystem.hpp). The PoC's UNLIT shader
    had no texcoord/sampler at all, so the texture was never sampled (Box/texture.x3d has a <Material/> -> Phong path, which
    is why it worked). Fixed PoC-side: added aTexCoord + sampler2D to unlit.vert/unlit.frag and bound the
    {Emissive,BaseColor,Diffuse} slot in the unlit draw path. SDK extraction was already spec-correct.
- id: VIS-MOVIE-DECODE
  nodes: [MovieTexture]
  component: Texturing
  clause: "23.4.1"
  severity: major
  status: fixed
  summary: "MovieTexture frames were never decoded — TextureRef::Source::Movie was surfaced but no consumer decode path existed, so movie-textured scenes rendered the white/last fallback (blank). FIXED for MPEG-1: the MovieDecoder seam + pl_mpeg Backend A play the video onto geometry (the whole NIST corpus is MPEG-1)."
  note: >-
    Implemented per ADR-0041: the MovieDecoder seam (runtime/extract/MovieDecoder.hpp) + Backend A pl_mpeg
    (runtime/io/plmpeg/, flag-gated x3d_plmpeg) wired into the PoC, which decodes the current media-time frame and uploads
    it as the texture each tick. The NIST .mpg files are RAW elementary video streams (no MPEG-PS system layer), so the
    backend drives pl_mpeg's low-level plm_video_t directly for those (plm_t + seek for program streams). Verified by the
    x3d_movie_tests semantics-contract test and by rendering Appearance/Appearance/movietexture.x3d (the VTS card plays on
    box/sphere/cone/cylinder). Theora since shipped as MovieDecoder Backend B (TheoraMovieDecoder, seam-status.md — the
    seam is STABLE); WebM remains a follow-up. MovieTexture time-lifecycle nuance tracked by TDN-5.

# Immersive-profile audit 2026-09-26: six independent spec-vs-code passes over every Immersive node.
# Each PROVEN entry has a failing probe test named in its note. AUD-ENV-1 (sensors under an unchosen
# Switch/LOD) was rejected: it conflicts with ADR-0034, an accepted decision on a spec ambiguity.
- id: AUD-TIME-1
  nodes: [TimeSensor]
  component: Time
  clause: "8.2.4.4"
  severity: major
  status: closed
  summary: "A late resume shifts the clock by resumeTime-pauseTime instead of the actual paused span, so fraction_changed jumps on resume."
  note: "X3DTimeDependentSystem now shifts the elapsed and cycle bases by the actual tick-to-tick paused span. Regression: timesensor_late_resume_keeps_fraction_frozen."
- id: AUD-TIME-2
  nodes: [TimeSensor]
  component: Time
  clause: "8.4.1"
  severity: minor
  status: closed
  summary: "A stop detected after stopTime emits the final values evaluated at the tick instead of at stopTime."
  note: "A scheduled stop evaluates final outputs at stopTime; a set_stopTime received after its requested time still evaluates at the receiving tick. Regression: timesensor_stop_uses_stop_time_for_final_output."
- id: AUD-TIME-3
  nodes: [TimeSensor, AudioClip, MovieTexture, Gain, BiquadFilter, OscillatorSource]
  component: Time
  clause: "8.2.4.3"
  severity: major
  status: closed
  summary: "set_startTime (and set_stopTime <= startTime) to an active node still overwrite the field and emit *_changed."
  note: "The shared X3DTimeDependentSystem registers a cascade/direct-write input filter for all attached time-dependent nodes; it rejects active startTime and stopTime <= active startTime before field writes or route fan-out, while allowing ordered stop-then-start restart. Regressions: timesensor_ignores_start_and_invalid_stop_while_active, time_dependent_nodes_ignore_active_timing_inputs."
- id: AUD-TIME-4
  nodes: [TimeSensor]
  component: Time
  clause: "8.2.2, 8.2.4.4"
  severity: low
  status: closed
  summary: "A negative absolute pauseTime never pauses (the code also requires pauseTime > 0)."
  note: "The shared pause/resume guards no longer require positive absolute times. Regression: timesensor_accepts_negative_absolute_pause_time."
- id: AUD-TIME-5
  nodes: [TimeSensor]
  component: Time
  clause: "8.4.1"
  severity: major
  status: closed
  summary: "Changing cycleInterval during an active loop makes fraction_changed jump instead of continuing smoothly at the new rate."
  note: "The cycle phase uses a separate base rebased from the last evaluated tick, leaving elapsedTime independent; a new interval below elapsed cycle duration completes that cycle. Regressions: timesensor_cycle_interval_change_keeps_fraction_continuous, timesensor_shorter_interval_completes_current_cycle."
- id: AUD-SEQ-1
  nodes: [IntegerSequencer, BooleanSequencer]
  component: EventUtilities
  clause: "30.2.4"
  severity: minor
  status: closed
  summary: "With a duplicated final key, the sequencer returns the last keyValue instead of the first."
  note: "The final-key clamp walks backward over equal final keys, including for fractions beyond the key range. Regression: integer_sequencer_duplicate_last_key_uses_first_value."
- id: AUD-INTERP-1
  nodes: [ScalarInterpolator, PositionInterpolator, OrientationInterpolator, ColorInterpolator, CoordinateInterpolator, NormalInterpolator]
  component: Interpolation
  clause: "19.3.1"
  severity: minor
  status: closed
  summary: "value_changed read before any input returns the field default instead of keyValue[0]."
  note: "The hand-written linear, spline, and Squad attach paths initialize value_changed from the first authored keyValue or row without posting an event. Regression: interpolator_initial_value_readback."
- id: AUD-PDS-1
  nodes: [TouchSensor, PlaneSensor, CylinderSensor, SphereSensor]
  component: PointingDeviceSensor
  clause: "20.2.1"
  severity: major
  status: closed
  summary: "Pointing sensors tied for lowest do not activate together; only the first sibling sensor gets the event."
  note: "PointingSensorSystem resolves all tied lowest siblings and retains independent active drag state for each. Covered by 'tied lowest pointing sensors all receive the event' and 'tied PlaneSensors retain independent drag offsets'."
- id: AUD-PDS-2
  nodes: [TouchSensor, PlaneSensor, CylinderSensor, SphereSensor]
  component: PointingDeviceSensor
  clause: "20.4.2"
  severity: major
  status: closed
  summary: "Disabling an active sensor deactivates it only on the next pointer update."
  note: "PointingSensorSystem checks enabled before its pointer-revision gate and deactivates disabled grabbed sensors on the next tick without pointer motion. Covered by 'disabling an active PlaneSensor deactivates without pointer motion'."
- id: AUD-PDS-3
  nodes: [TouchSensor, PlaneSensor, CylinderSensor, SphereSensor, Switch]
  component: PointingDeviceSensor
  clause: "10.4.3, 20.2.3"
  severity: major
  status: closed
  summary: "Geometry in an unchosen Switch branch is still pickable and can occlude visible geometry."
  note: "PickSystem checks each cached placement against live Switch and LOD selection on every pick, matching the extractor's active transformation path without stale index entries. Covered by 'pointing sensors ignore geometry in an unchosen Switch branch', 'pick index follows live Switch selection', and 'pick index follows live LOD level'."
- id: AUD-KDS-1
  nodes: [StringSensor]
  component: KeyDeviceSensor
  clause: "21.4.2"
  severity: minor
  status: closed
  summary: "Deletion removes one UTF-8 byte instead of one character."
  note: "StringSensor deletion removes all bytes of the final UTF-8 character. Covered by 'StringSensor deletion removes one UTF-8 character'."
- id: AUD-KDS-2
  nodes: [StringSensor]
  component: KeyDeviceSensor
  clause: "21.4.2"
  severity: minor
  status: closed
  summary: "enteredText is not cleared after finalText is generated."
  note: "StringSensor clears the stored enteredText output field after posting finalText without posting an enteredText event. Covered by 'StringSensor enteredText field resets silently at termination'."
- id: AUD-ENV-2
  nodes: [ProximitySensor, VisibilitySensor]
  component: EnvironmentalSensor
  clause: "22.4.1"
  severity: minor
  status: closed
  summary: "Disabling an active sensor emits exitTime."
  note: "Disabling an active ProximitySensor or VisibilitySensor now emits isActive FALSE for routed state (following §20.4.2 pointing-sensor precedent) but no exitTime. Covered by disabling_proximity_sensor_sends_no_exit_time and disabling_visibility_sensor_sends_no_exit_time."
- id: AUD-ENV-3
  nodes: [ProximitySensor, VisibilitySensor]
  component: EnvironmentalSensor
  clause: "22.4.1, 22.4.3"
  severity: major
  status: closed
  summary: "DEF/USE sensor instances are evaluated through one transform path, not the union of all instances."
  note: "ProximitySensor and VisibilitySensor now evaluate the union of per-path boxes, limited to active paths by ADR-0034. Covered by proximity_sensor_uses_union_of_active_instances and visibility_sensor_uses_union_of_active_instances."
- id: AUD-ENV-4
  nodes: [ProximitySensor]
  component: EnvironmentalSensor
  clause: "22.4.1"
  severity: minor
  status: closed
  summary: "No position_changed/orientation_changed at exit time."
  note: "ProximitySensor now emits changed position and orientation at the exit instant. Covered by proximity_sensor_reports_position_on_exit."
- id: AUD-ENV-5
  nodes: [ProximitySensor, NavigationInfo]
  component: EnvironmentalSensor
  clause: "22.4.1"
  severity: minor
  status: closed
  summary: "centerOfRotation_changed fires without LOOKAT in the bound NavigationInfo."
  note: "ProximitySensor now emits centerOfRotation_changed only while the bound NavigationInfo includes LOOKAT. Covered by proximity_center_of_rotation_requires_lookat and testProximityCenterOfRotationChanged."
- id: AUD-NAV-1
  nodes: [Viewpoint, NavigationInfo]
  component: Navigation
  clause: "23.3.1"
  severity: major
  status: closed
  summary: "A Viewpoint's dedicated NavigationInfo is not unbound when the Viewpoint is unbound."
  note: "ViewpointBindSystem now sends set_bind FALSE to a Viewpoint's dedicated NavigationInfo when its parent is unbound. Covered by viewpoint_unbinds_its_navigation_info."
- id: AUD-NAV-2
  nodes: [NavigationInfo, Viewpoint]
  component: Navigation
  clause: "23.4.4"
  severity: minor
  status: closed
  summary: "TELEPORT (and zero-duration) transitions never emit transitionComplete."
  note: "ViewpointBindSystem now emits transitionComplete for TELEPORT and zero-duration camera transitions. Covered by teleport_transition_signals_complete and zero_duration_transition_signals_complete."
- id: AUD-PROTO-1
  nodes: [ProtoInstance]
  component: Core
  clause: "4.4.4.3"
  severity: major
  status: closed
  summary: "Peer nodes after the first in a PROTO body are never enrolled, so a peer TimeSensor/Script never runs."
  note: "Expanded PROTO body peers are retained in Scene::protoPeerNodes and included in standard runtime system enrollment without adding them to render roots. Regression: proto_peer_timesensor_remains_active."
- id: AUD-NET-1
  nodes: [Inline, IMPORT, EXPORT]
  component: Networking
  clause: "9.2.5"
  severity: major
  status: closed
  summary: "IMPORT resolves an Inline DEF that the Inline never EXPORTed."
  note: "wireInlineImports now requires an explicit child EXPORT whose public name matches importedDEF; a private DEF no longer becomes a parent alias. Regression: import_requires_explicit_export."
- id: AUD-NET-2
  nodes: [Inline]
  component: Networking
  clause: "9.4.2"
  severity: major
  status: closed
  summary: "An Inline cannot load (or unload/replace) at runtime: load/url events after parse do nothing."
  note: "InlineRuntimeSystem unloads on load=FALSE and unloads then reloads on url change. System::detach removes per-node runtime state before the old subtree is released; routes, pending deliveries, IMPORT aliases, binding/pick entries, and extracted RenderItems are removed. Regression tests: inline_load_unload_reload_detaches_content_and_reports_removal, inline_url_change_replaces_loaded_content, nested_inline_loaded_with_parent_can_unload, inline_repeated_replacement_drops_unowned_nodes. ADR-0051 records the detach order and extraction delta rule."
- id: AUD-NET-3
  nodes: [LoadSensor, Anchor, Viewpoint]
  component: Networking
  clause: "9.4.3"
  severity: minor
  status: closed
  summary: "LoadSensor counts an Anchor's target Viewpoint as loaded before it is bound."
  note: "LoadSensor now waits until the Anchor's #Viewpoint target is actually bound, and ignores Anchor.load as required by §9.4.1. Regression: events_misc_test checks unbound then bound target with load FALSE."
- id: AUD-LGT-1
  nodes: [PointLight, SpotLight]
  component: Lighting
  clause: "17.4.2, 17.4.3"
  severity: major
  status: closed
  summary: "Light radius ignores ancestor scale."
  note: "LightSystem scales radius through ancestor transforms. Covered by point_light_radius_scales_with_parent_transform and spot_light_radius_scales_with_parent_transform."
- id: AUD-LGT-2
  nodes: [DirectionalLight, PointLight, SpotLight, Switch]
  component: Lighting
  clause: "10.4.3"
  severity: major
  status: closed
  summary: "Lights in an unchosen Switch branch (or inactive LOD level) still illuminate."
  note: "LightSystem and SceneExtractor share Switch and LOD branch selection. Covered by light_under_inactive_switch_does_not_illuminate and light_under_unselected_lod_level_does_not_illuminate."
- id: AUD-EXT-1
  nodes: [Extrusion]
  component: Geometry3D
  clause: "13.3.5.6, 11.2.3"
  severity: major
  status: closed
  summary: "Caps are fanned from vertex 0 even with convex FALSE, so a concave cap covers its notch."
  note: "Extrusion caps with convex FALSE use the IndexedFaceSet ear clipper. Covered by extrusion_concave_cap_does_not_cover_notch."
- id: AUD-RND-1
  nodes: [LineSet, IndexedLineSet, PointSet]
  component: Rendering
  clause: "11.2.2.5"
  severity: minor
  status: closed
  summary: "Authored normals on points/lines are dropped, so they can never be lit."
  note: "Line and point meshes retain authored normals, and both example renderers light them. Covered by line_and_point_normals_enable_lighting and linepoint_style_test."
- id: AUD-RND-2
  nodes: [LineSet, IndexedLineSet, PointSet, Material]
  component: Rendering
  clause: "11.2.2.5"
  severity: minor
  status: closed
  summary: "Unlit points/lines take the Material's diffuse colour instead of emissiveColor."
  note: "MaterialDesc exposes unlitGeometryRGBA, which both example renderers use for normal-less lines and points. Covered by unlit_line_set_material_uses_emissive_color."
- id: AUD-BG-1
  nodes: [Background, TextureBackground]
  component: EnvironmentalEffects
  clause: "24.2.1"
  severity: minor
  status: closed
  summary: "Decreasing skyAngle/groundAngle values are accepted silently."
  note: "Range validation emits BACKGROUND_ANGLE_ORDER warnings for decreasing skyAngle and groundAngle, preserving lenient reads (ADR-0003). Test: Background reports decreasing sky and ground angles."
- id: AUD-BG-2
  nodes: [TextureBackground, MultiTexture]
  component: EnvironmentalEffects
  clause: "24.4.5"
  severity: minor
  status: closed
  summary: "A MultiTexture panorama face is dropped from BackgroundDesc."
  note: "TextureRef now carries MultiTexture panorama stages and BackgroundDesc counts populated stages. Test: TextureBackground preserves MultiTexture panorama face. Completes ENV-11."
- id: AUD-TEX-1
  nodes: [ImageTexture, MovieTexture, X3DUrlObject]
  component: Texturing
  clause: "9.3.2, 18.4.1"
  severity: minor
  status: closed
  summary: "load FALSE on a texture still fetches its url."
  note: "Texture refs omit URL candidates while load is FALSE, so the consumer resolver cannot fetch them. Test: ImageTexture load FALSE suppresses URL fetch."
- id: AUD-TEX-2
  nodes: [MultiTexture]
  component: Texturing
  clause: "18.4.3"
  severity: major
  status: closed
  summary: "MultiTexture mode/source/function/color/alpha never reach the descriptor, so stages cannot be blended as authored."
  note: "TextureRef now retains ordered MultiTexture stages with mode, source, function, color and alpha, including defaults; resolver enrichment traverses stages. Test: MultiTexture stages preserve blend controls."
- id: AUD-TEX-3
  nodes: [TextureProperties]
  component: Texturing
  clause: "18.4.9"
  severity: low
  status: closed
  summary: "borderColor (deprecated in v4.0) is not extracted."
  note: "TextureProperties.borderColor now reaches ExtendedSamplerParams and the CPU reference sampler. Test: texture_extract_test custom borderColor assertions."
- id: AUD-MEDIA-1
  nodes: [MovieTexture]
  component: Texturing
  clause: "18.4.2"
  severity: major
  status: closed
  summary: "set_speed changes an active movie's cycle; it must be ignored while playing."
  note: "Active MovieTexture speed deliveries are ignored and MediaTimeSystem holds the activation rate for cycle timing. Test: MovieTexture ignores speed changes while active. Completes TDN-5."
- id: AUD-MEDIA-2
  nodes: [AudioClip]
  component: Sound
  clause: "16.4.2"
  severity: major
  status: closed
  summary: "set_pitch changes an active clip's timing and playback rate; it must be ignored."
  note: "Active AudioClip pitch deliveries are ignored; MediaTimeSystem and SoundSystem use the activation pitch for timing and PlaybackRate. Tests: AudioClip ignores pitch changes while active; sound_immersive_test activation pitch case. Completes TDN-5/ADR-0050."
- id: AUD-MEDIA-3
  nodes: [MovieTexture]
  component: Texturing
  clause: "18.4.2"
  severity: minor
  status: closed
  summary: "MovieTexture never sends duration_changed: the SDK opens no media (ADR-0041) and the MovieDecoder seam carries no duration."
  note: "The additive reportMovieDuration(context, movie, seconds) helper posts duration_changed through the cascade after consumer loading, feeding routes and MediaTimeSystem. Test: consumer reported MovieTexture duration drives lifecycle."
- id: AUD-MEDIA-4
  nodes: [Sound, MovieTexture]
  component: Sound
  clause: "16.4.17"
  severity: major
  status: closed
  summary: "Sound.source may be a MovieTexture, but SoundSystem builds only AudioClip sources."
  note: "SoundSystem resolves MovieTexture media through an injected movie-audio decoder and creates a PCM Buffer driven by isActive/isPaused and activation speed (ADR-0052). Tests: testMovieTextureSourceLifecycle and pl_mpeg decodes a movie MP2 track to mono PCM."

# Published X3D 4.0 requirements audit, 2026-09-28, baseline a8aefc5.
# Static source evidence; REQ-UNIT additionally reproduced via the rebuilt CLI.
# Scope and acceptance cases: docs/wiki/guides/x3d4-requirements-audit.md.
- id: REQ-UNIT
  nodes: [Transform, Viewpoint, Box]
  component: Core
  clause: "4.3.6; 7.2.5.5"
  severity: major
  status: open
  summary: Runtime applies UNIT factors to explicitly authored known dimensional values at initialization; components beyond Interactive and conversion-aware writing remain incomplete.
  note: "Runtime entry normalizes explicitly authored known dimensional fields to initial/SI units, while generated built-in defaults remain canonical. Focused tests: `UNIT runtime: equivalent authored length and angle geometry`, `UNIT runtime: routed motion, defaults, and subsequent writes use initial units`, `UNIT runtime: Inline and EXTERNPROTO use their source units`, `UNIT runtime: PhysicsSystem receives kilograms and newtons`, and `UNIT runtime: custom PROTO values convert independently at dimensional IS targets`. TextureTransform.rotation now also converts authored angle units, including dimensional IS targets; two TextureTransform UNIT regressions retain dimensionless UV center/translation/scale, defaults, idempotent initialization and subsequent radian writes. Coverage demonstrates equivalent degree/radian geometry, routed updates, length, mass, force and torque, source-specific Inline/EXTERNPROTO factors, dimensional IS targets, and codec round-trip preservation before runtime. REQ-UNIT remains open: the field-dimension map and its range are incomplete, and serialization after runtime conversion does not yet preserve authoring units. Background and TextureBackground skyAngle/groundAngle now normalize authored angle units, with an idempotence regression. Every length/angle field of the Interactive profile's nodes is now mapped: X3DBoundedObject bboxCenter/bboxSize on every node (the -1 -1 -1 bboxSize sentinel is kept), PlaneSensor axisRotation, and PointLight/SpotLight attenuation, whose linear and quadratic coefficients scale by 1/length and 1/length^2 so falloff is equivalent at the same physical distance (`UNIT runtime: Interactive-profile bounds, sensor and light fields`). Still open: fields of components beyond Interactive that are not in the map (for example TextureCoordinateGenerator SPHERE-REFLECT-LOCAL eye parameters) and serialization in authoring units after runtime conversion. Resolve the published Core wording on external UNIT declarations separately from the demonstrated runtime behavior."
- id: REQ-CLIP
  nodes: [ClipPlane]
  component: Rendering
  clause: "11.4.1; F.5"
  severity: major
  status: fixed
  summary: ClipPlane equations and enabled state reached extraction and the CPU reference rasterizer, but the GL poc_renderer ignored planes.
  note: "Wired: SceneExtractor collects enabled ClipPlane nodes as scoped state (a plane affects the following siblings and their subtrees within its parent grouping node) and carries the plane on RenderItem::clipPlanes (ClipPlaneList, fixed capacity kMaxClipPlanes=6 per Annex F.5) resolved to WORLD space (n' = M^-T n through the ClipPlane's world frame; x3d::runtime::transformPlane in runtime/math/Mat4.hpp). The CPU reference rasterizer (examples/cpu_raster) discards fragments where a*x+b*y+c*z+d < 0 in eye space (SceneRender.hpp maps each world plane through the view matrix, Rasterizer.hpp tests it). Posted ClipPlane field changes and indexed ancestor-frame changes now conservatively replace the extraction baseline, refreshing per-item world planes; disabled and empty scopes retain invalidation dependencies. Tests: scene_extractor_state_delta_test (channel-respecting mirror vs fresh snapshot, shared placements, disabled/empty scopes and unrelated-TRS retention), scene_extractor_clip_test (scope/enabled/world-transform/re-snapshot) and cpuraster clip_plane_test (half-space discard, multi-plane, all-clip). Fixed for the GL poc_renderer: it maps each plane to eye space per draw, lit.vert/unlit.vert write gl_ClipDistance for the Phong, PBR and unlit programs (GL_CLIP_DISTANCE0..n-1 enabled only for those draws), and author programs receive the planes through the numClipPlanes/clipPlane vocabulary uniforms and clip themselves. Test: examples/poc_renderer/tests/clip_plane_gl_test.py (each built-in program cut at x = 0; a disabled plane draws the box whole) under Xvfb. Camera near/far clipping is a different operation."
- id: REQ-FILL
  nodes: [FillProperties]
  component: Shape
  clause: "12.4.3"
  severity: major
  status: fixed
  summary: Appearance.fillProperties is not extracted; filled, hatched, hatchColor and hatchStyle have no rendering effect.
  note: "MaterialDesc::fill now extracts all four fields, and appearance dependency tracking refreshes live field changes and replacement nodes. CPU and built-in OpenGL Phong/Physical/Unlit paths implement independent filled/hatched flags, hatchColor, required styles 1-6 and fallback to style 1; holes discard both color and depth writes. material_system_test and scene_extractor_t7_test cover extraction/copy/update behavior; CPU rasterizer/render-smoke tests and check_poc_fill_properties.py cover pixels, patterns, depth holes and polygon-only application. The reference grid is eight window pixels; hatch fragments retain material alpha/coverage and receive fog. This closes FillProperties presentation in the tested reference paths, not the separate author-shader or full Shape-component obligations."
- id: REQ-LOCALFOG
  nodes: [LocalFog, FogCoordinate]
  component: EnvironmentalEffects
  clause: "24.2.2; 24.4.3; 24.4.4"
  severity: major
  status: open
  summary: Global Fog and LocalFog scope work end to end in both reference hosts, but authored FogCoordinate depths remain ignored by the geometry pipeline.
  note: "WIRED (LocalFog): LocalFogSystem (§24.4.3, the LightSystem walk pattern) collects every enabled LocalFog, world-scales visibilityRange, and records the full enclosing-group placement chain as scopePath (scopeRoot remains informational); SceneExtractor tags each RenderItem with the nearest in-scope LocalFog index (RenderItem.localFog, resolved via snapshotLocalFogs()), enabled==false being skipped so global Fog applies unchanged. Posted LocalFog field changes and indexed ancestor-frame changes now conservatively replace the extraction baseline, refreshing snapshotLocalFogs and item indices together; disabled and empty scopes retain invalidation dependencies (scene_extractor_state_delta_test). Full path-prefix matching now distinguishes USE-shared enclosing groups, including nearest nested scopes; explicit expected ranges cover snapshots and ancestor-scale deltas. Root fog remains scene-wide, and disabled fog falls back to an outer enabled fog or global Fog. The appended vector is an experimental descriptor layout change requiring recompilation, not a stable ABI promise. The CPU rasterizer (examples/cpu_raster/cpuraster/SceneRender.hpp) selects the tagged LocalFog per item over the bound global Fog; tests: scene_extractor_local_fog_test (scope, enabled, world scale, nesting) and render_smoke_test's local-fog fragment check. IGNORED (FogCoordinate): MeshBuilder never reads a geometry's fogCoord field and MeshData carries no fog-depth array, so a per-vertex depth channel would have to thread a new vertex stream through MeshData, the PackedMesh slab and every material/GLSL model — not a small slice. Authored vertex depths therefore do not yet replace the computed eye-space distance, and a short depth list does not repeat its final entry. The GL poc_renderer (examples/poc_renderer) uploads each item's fog per draw, the tagged LocalFog in place of the bound global Fog, for its Phong, PBR and unlit programs; examples/poc_renderer/tests/local_fog_gl_test.py (run by validate-examples) checks in-scope, out-of-scope and disabled LocalFog pixels (2026-10-10). Scene-authored shaders receive no fog uniforms. Existing scene_extractor_fog_test proves bound global Fog is unchanged."
- id: REQ-LAYER
  nodes: [Layer, LayerSet]
  component: Layering
  clause: "35.2.3; 35.4.2"
  severity: major
  status: open
  summary: Layers share one binding stack per category and one camera; LayerSet.activeLayer does not select navigation.
  note: "BindingSystem::stacks_ is keyed only by category, X3DExecutionContext owns one BindingSystem, and SceneExtractor exposes one camera/background/fog. activeLayer has no production runtime read. LayerSet.order traversal and Layer.pickable do not establish independent layers. Acceptance: two layers bind different viewpoints/backgrounds without affecting one another, activeLayer selects input/navigation, and later ordered layers appear above earlier ones, including repeated ordinals."
- id: REQ-LAYOUT
  nodes: [Layout, LayoutGroup, LayoutLayer, ScreenGroup, ScreenFontStyle]
  component: Layout
  clause: "36.2; 36.4.1-36.4.5"
  severity: major
  status: open
  summary: Layout rectangles and screen-relative transforms are absent; ScreenFontStyle.pointSize is treated as a world-space size.
  note: "No production layout-node dispatch exists in TransformSystem or SceneExtractor. TextExtract::readFontStyleParams copies pointSize into FontStyleParams::size without viewport/DPI conversion. Acceptance: nested align/offset/size/scaleMode in WORLD/FRACTION/PIXEL units; ScreenGroup retains pixel scale while the camera moves; screen text and LayoutLayer work with viewport changes."
- id: REQ-SHADER
  nodes: [ComposedShader, PackagedShader, ProgramShader, ShaderPart, ShaderProgram]
  component: Shaders
  clause: "31.2.2.3; 31.2.4; 31.3.2; 31.4"
  severity: major
  status: fixed
  summary: Scene-authored programs never populated RenderItem.shaderProgram or drove shader selection outputs.
  note: "Fixed: runtime/extract/ShaderExtract.hpp::selectShader walks Appearance.shaders in order and selects the first ComposedShader or ProgramShader whose language is GLSL and whose program is valid; other node types and languages stay inert, which §31.2.2.3 permits (PackagedShader is not supported). Part sources come from the inline CDATA (sourceCode, now also captured for ShaderProgram), then the first url that resolves: data: urls decode in the SDK, other urls go to ShaderOptions::resolver (AssetKind::Shader), and a Pending url defers validity. Validity is ShaderOptions::validator (a host compile check), defaulting to a structural VERTEX+FRAGMENT check. SceneExtractor sets RenderItem::shaderProgram (stages, author fields with current values, language) and re-selects on appearance-subtree DirtyField, so uniform events, url/sourceCode edits and activate reach the incremental delta as updatedMaterial. ShaderSystem (attached by attachStandardRuntime and RuntimeSession) runs the same selection and emits isValid (first evaluation, changes, every activate TRUE) and isSelected (on selection changes); activate TRUE re-resolves urls and re-validates. Reference hosts: cpu_raster runs the selected fragment stage in its GLSL interpreter with interpreterShaderValidator; the GL PoC validates by compiling in its context and uploads every SF author-field type. Tests: shader_selection_test (11 cases), cpuraster author_shader_test and poc author_shader_gl_test (pixel output, uniform event, fall-through and material fallback). Remaining gaps are REQ-SHADER-2."
- id: REQ-SHADER-2
  nodes: [ComposedShader, ProgramShader, ShaderProgram]
  component: Shaders
  clause: "31.2.4; 31.4"
  severity: minor
  status: open
  summary: Texture (SFNode) and array (MF) author-field uniforms reach the program descriptor without a value.
  note: "ShaderFieldBinding carries an X3DFieldValue, which has no texture or array alternative, so an SFNode field naming an X3DTextureNode, or an MFFloat/MFVec3f uniform array, is listed with an empty value and neither reference host binds it. Also ignored: geometry and tessellation stages are assembled but the GL PoC links only VERTEX+FRAGMENT, and the CPU host interprets only the FRAGMENT stage (its rasterizer supplies the varyings). Acceptance: texture uniforms resolve to TextureRefs a host can bind to sampler uniforms, and MF uniforms reach array uniforms, both with live updates."
- id: REQ-CUBE
  nodes: [ComposedCubeMapTexture, ImageCubeMapTexture, GeneratedCubeMapTexture]
  component: CubeMapTexturing
  clause: "34.2; 34.4.1-34.4.3"
  severity: minor
  status: open
  summary: Both reference hosts render ComposedCubeMapTexture, DDS ImageCubeMapTexture and GeneratedCubeMapTexture as environment maps in the geometry's local frame; explicit 3D texture coordinates, 3D texture transforms, non-base slots and autoRefresh are not wired.
  note: "GeneratedCubeMapTexture (2026-10-10, ADR-0060): refOf emits a Source::Cube ref with TextureRef::generatedCube (node, update, size) and the consumer renders it. GeneratedCubeMapSystem (attachStandardRuntime) resets NEXT_FRAME_ONLY to NONE at the start of the tick after the frame that drew it, as an event (update_changed is routed). cpu_raster (SceneRender GeneratedCubeCache) and the GL PoC (a six-layer render target per node) re-render a cube whose update is not NONE: six size x size views, field of view pi/2, from the local origin of the first Shape using it along its local axes, without the Shapes that use it; faces persist, so NONE keeps the last ones and a never-rendered cube samples white. A cube shared by differently placed Shapes is drawn from the first; in the GL PoC its faces are stored for the first Shape's material model (sRGB for PBR). ImageCubeMapTexture (2026-10-10, ADR-0059): refOf emits a url Source::Cube ref (load honoured); the TextureResolver decodes the file to six layers (TexturePixels::layers) in X3D face order. Both decode backends and the GL PoC's resolver read DDS through runtime/io/dds/DdsDecode.hpp: uncompressed 8/16/24/32-bit masks and BC1-BC3 (FourCC or DX10), first mip level, partial cubes with white missing faces; DDS +Z is the X3D front (z mirrored from DDS's left-handed layout). Other cube formats, mipmaps, autoRefresh and autoRefreshTimeLimit are not wired. ComposedCubeMapTexture (2026-10-10): cpu_raster (Texture::sampleCube, MaterialShader environmentDirection) and the OpenGL PoC (shaders/multitexture.glsl sampleCubeFaces, a six-layer texture array on unit 12) sample a cube ref in the base-colour slot or as a MultiTexture stage. The lookup direction is the full (s, t, r) vector of the geometry's TextureCoordinateGenerator (all Table 18.6 modes; NOISE adds a third noise channel), or with no generator the camera-space reflection vector; eye-space directions are carried into the geometry's local frame (inverse of view * model), so the cube turns with the geometry (ADR-0060); §34.2.2 names CAMERASPACEREFLECTIONVECTOR as the usual generator but does not set a default, so that default is an implementation choice. Faces follow Figure 34.1 with the Background panorama convention (front -Z, back +Z, left -X, right +X, top +Y, bottom -Y, each upright seen from the centre). Tests: cube_map_test (cpu_raster) and cube_map_gl_test.py (validate-examples). Not wired: TextureCoordinate3D/4D explicit (s, t, r) coordinates, TextureTransform3D/Matrix3D on the direction, cube maps in slots other than base colour, and in the GL PoC more than one cube map per material (later cube stages reuse the first) and faces of unequal size (resampled to the largest). Tests for images: texture_decode_tests (texture_dds_cube_and_2d), background_desc_test, and the DDS cases in cube_map_test and cube_map_gl_test.py. Tests for generated cubes: generated_cube_map_test (doctest: descriptor, NEXT_FRAME_ONLY reset and routing), generated_cube_map_test (cpu_raster: update modes, self-exclusion, local frame, cache) and generated_cube_map_gl_test.py; the rotated cases in cube_map_test and cube_map_gl_test.py pin the local frame. Acceptance for the rest: TextureCoordinate3D/4D directions, TextureTransform3D/Matrix3D, cube maps in other slots, autoRefresh."
- id: REQ-MULTITEXTURE
  nodes: [MultiTexture, MultiTextureCoordinate, MultiTextureTransform]
  component: Texturing
  clause: "18.2.4; 18.4.3-18.4.5"
  severity: major
  status: fixed
  summary: Both reference hosts combine MultiTexture stages with their modes, source/function controls and independent stage coordinates.
  note: "CPU implements all Table 18.3 modes, separate RGB/alpha mode tokens, Table 18.4 source selection of Arg2, and Table 18.5 post-operation functions. Each stage selects its MultiTextureCoordinate channel or named mapping and matching MultiTextureTransform, including generators. A single TextureTransform applies to every channel. Live transform and nested coordinate edits refresh baked meshes and coordinate-generation descriptors through the existing dependency indices; RuntimeSession regressions cover both channels. Tests: multi_texture_test and interchange_test, including rendering two stages with distinct transformed UVs and a material-free Appearance. The published table contradicts itself for REPLACE and SELECTARG2: REPLACE selects the stage texture (Arg1), SELECTARG2 selects the previous result (Arg2), following the respective operation meanings. The OpenGL PoC combines the base-colour stages in its unlit, Phong and PBR programs (examples/poc_renderer/shaders/multitexture.glsl, the same operators and interpretations as the CPU) with UV sets 0-3 as vertex attributes; examples/poc_renderer/tests/multitexture_gl_test.py (run by validate-examples) checks stage modes, UV channels and FACTOR source in each program (2026-10-10). Its remaining limits are REQ-MULTITEXTURE-2. Annex B explicitly includes MultiTexture despite its component level exceeding Texturing 2; the conformance view and CLI preserve that node-table exception. (2026-10-02)"
- id: REQ-MULTITEXTURE-2
  nodes: [MultiTexture, MultiTextureCoordinate]
  component: Texturing
  clause: "18.4.3; 18.4.4"
  severity: minor
  status: open
  summary: The OpenGL PoC combines at most four MultiTexture stages over four UV sets and evaluates one coordinate generator per material.
  note: "The CPU reference host has none of these limits. In the PoC (examples/poc_renderer), stages after the fourth are ignored; a channel beyond UV set 3 samples set 3; only the material's first TextureCoordinateGenerator is evaluated (shaders/texgen.glsl), so another stage's or slot's generator falls back to its authored UV set, and every non-stage texture slot (normal, emissive, specular, metallic-roughness, occlusion) samples that one coordinate source rather than its own mapping. Acceptance: the GL host matches cpu_raster for more stages, more UV sets and per-stage generators. (2026-10-10)"
- id: REQ-PROJECTION
  nodes: [TextureProjector, TextureProjectorParallel]
  component: TextureProjection
  clause: "42.2; 42.3.1; 42.4.1; 42.4.2"
  severity: major
  status: open
  summary: Texture projectors have bindings and validation aliases but no projection or light extraction path.
  note: "LightSystem::lightType accepts only DirectionalLight, PointLight and SpotLight; RenderItem/LightDesc carry no projected texture or projector matrix. Acceptance: perspective and parallel projected textures, clipping/range, on/global scope, transforms, and aspectRatio updates. Published chapter URL is components/textureProjection.html; the Full-profile link and UOM spelling currently return 404."
- id: REQ-SHADOW
  nodes: [DirectionalLight, PointLight, SpotLight]
  component: Lighting
  clause: "17.2.2.8; 17.3.1"
  severity: major
  status: fixed
  summary: Both reference hosts apply per-light occlusion by castShadow shapes and shadowIntensity.
  note: "CPU renderScene collects visible triangle occluders with castShadow TRUE and traces each shadow-enabled light in normalized scene coordinates. Visibility multiplies the light contribution by 1-shadowIntensity for an occluded fragment. Tests exercise enabled/disabled shadows, intermediate intensity, hidden and non-casting occluders, and equivalent very small/large scenes. Soft-shadow fidelity is optional. The OpenGL PoC renders a 1024x1024 depth map per shadow-enabled light before the scene pass (one orthographic layer over the scene bounds for DirectionalLight, one perspective layer over the cone for SpotLight with cutOffAngle below 1.4 rad, six 92-degree cube faces for PointLight and wider spots) from castShadow triangle shapes; its Phong and PBR programs scale the light reaching an occluded fragment by 1-shadowIntensity (examples/poc_renderer/shaders/shadow.glsl). Limits: at most 24 depth layers per frame (lights past that are unshadowed), shadow-map resolution and bilinear depth comparison rather than an exact ray query, and the headlight never shadows. examples/poc_renderer/tests/shadow_gl_test.py (run by validate-examples) checks all three light types in both programs, shadowIntensity 0.5, castShadow FALSE and shadows FALSE. (2026-10-10)"
- id: REQ-JAVA
  nodes: [Script]
  component: Scripting
  clause: "F.5 Table F.3 (Script); 29.2.8; 29.4.1"
  severity: major
  status: deferred
  summary: The published Full profile requires Java scripting in addition to ECMAScript; the shipped engines implement ECMAScript only.
  note: "EcmaScriptBackend and QuickJsBackend are the two concrete ScriptEngine implementations. An external engine could fill this seam, but no Java adapter or language-selection configuration is supplied or tested. The component's general allowance to choose languages must be read with the Full-profile requirement. Acceptance: a declared Full host runs Java Script fixtures with the applicable SAI binding and ordered URL fallback; this does not require adding a JVM dependency to the default SDK."
- id: REQ-FTP
  interfaces: [X3DUrlObject]
  component: Networking
  clause: "B.6 Table B.4; F.6 Table F.4; 9.2.1"
  severity: major
  status: fixed
  summary: The optional curl backend supplies separate HTTP/HTTPS and FTP adapters; the CPU reference host routes these alongside confined local files.
  note: "Annex B also requires FTP; the earlier Full-only classification was incorrect. makeFtpResolver shares the bounded curl transport and post-DNS address policy but permits FTP only. makeHttpResolver remains restricted to HTTP/HTTPS. Hermetic passive-FTP tests cover successful bytes, missing files, size limits and private-network policy. The CPU host wires file/http/https/ftp through SchemeRouter and decodes fetched PNG/JPEG bytes through the stb adapter. Private networks require explicit opt-in by an embedder; the reference executable uses the default public-network policy. (2026-10-02)"

- id: PROTO-NODE-INIT
  interfaces: [X3DPrototypeInstance]
  nodes: [ProtoInstance]
  component: Core
  clause: "4.4.3; 4.4.4.2; 4.4.4.3"
  severity: major
  status: fixed
  summary: "Declaration-owned node defaults and nested literal overrides were shared across PROTO instances; explicit NULL/empty overrides fell back to defaults."
  note: "Reproduced identical pointers for two instances and their declaration default, with mutation of one changing both others. Expansion now clones declaration-owned graphs through the per-instance body clone map, preserving aliases and authored scalar provenance. Caller-supplied override graphs retain their original identity. A present node fieldValue now overrides even with an empty node list, including nested IS forwarding. Regressions in proto_expand_test.cpp: PROTO node defaults belong to each instance; PROTO explicit node overrides retain caller identity and empty values; PROTO nested literal node overrides clone with outer instance; nestedInstanceIsConnectForwardTest. This does not establish complete PROTO or UNIT conformance."

- id: PROTO-PARSE-SCOPE
  interfaces: [X3DPrototypeInstance]
  nodes: [ProtoInstance]
  component: Core
  clause: "4.4.3; 4.4.4.4"
  severity: major
  status: fixed
  summary: "PROTO interface defaults used incorrect DEF scopes, and nested prototype lookup could select inherited declarations before local declarations."
  note: "XML/JSON defaults previously used the enclosing scene DEF table; Classic used a fresh table for each default. All three readers now use one private Scene for a declaration's interface and body, inheriting prototype declarations but not outer DEFs. Reader registration replaces same-name inherited lookup entries across PROTO/EXTERNPROTO kinds while preserving parent Scene records and already-bound instances. XML now recognizes direct nested declarations in ProtoBody. declarationDefScopeTest and nestedDeclarationShadowingTest in proto_front_door_test.cpp cover three encodings, aliases, boundaries and cross-kind shadowing. Nested declaration serialization is tracked separately by PROTO-NESTED-WRITE."
- id: PROTO-NESTED-WRITE
  interfaces: [X3DPrototypeInstance]
  nodes: [ProtoInstance]
  component: Core
  clause: "4.4.4.4"
  severity: major
  status: open
  summary: "Some cross-encoding declaration orders remain unsupported."
  note: >-
    Remaining: Classic repeated field groups with intervening other fields or prefixes
    containing prototype instances/declarations (including descendants/default templates
    and author fields), and JSON repeated slot groups. They still fail explicitly; supporting them needs binding-aware scope
    rewriting and cross-field ordering. Classic now moves intervening local/extern
    declarations before an ordinary node prefix of the same field, preserving child order,
    expansion and DEF/USE identity (literalPrefixDeclarationRoundTripTest). The declaration
    ledger is not mutated. Direct body order and XML/canonical XML node-child order already
    round-trip. Existing nodeContainedInterleavedFieldTest retains the shadowing rejection;
    repeatedNodeFieldJsonGuardTest retains the JSON duplicate-slot guard. JSON checks
    establish repository compatibility, not ISO encoding conformance.

- id: PROTO-WRITE-DEF-SCOPE
  interfaces: [X3DPrototypeInstance]
  nodes: [ProtoInstance]
  component: Core
  clause: "4.4.3; 4.4.4.4"
  severity: major
  status: fixed
  summary: "PROTO serialization reset DEF/USE bookkeeping between interface defaults and body nodes, splitting shared identity."
  note: "Reproduced a second DEF Shared in ProtoBody when a body USE referenced an interface default. Each XML, canonical XML, Classic and JSON declaration writer now uses one fresh DEF/USE context across interface defaults and body, with another fresh context for nested declarations. declarationAliasWriteTest verifies identity across two default fields and body nodes, and isolation of a nested declaration using the same DEF name."
- id: PROTO-PRIMARY-ORDER
  interfaces: [X3DPrototypeInstance]
  nodes: [ProtoInstance]
  component: Core
  clause: "4.4.4.3"
  severity: major
  status: fixed
  summary: "Expansion rejects a body containing only a prototype instance and does not preserve primary-versus-peer order for direct nested instances."
  note: "The original CLI reported Wrap: empty proto body for a valid body containing only ProtoInstance Leaf. Expansion now uses orderedStatements to select the first authored node/instance, keeps subsequent direct nodes as active non-rendered peers, and registers interface redirects against the selected primary. An unresolved first instance is not replaced by a later peer. Four new proto_expand_test.cpp cases cover nested-only bodies, both primary/peer orders, unresolved primary, redirect ownership and parsed XML. Body-local ROUTEs targeting IS-mapped nested instance interfaces are covered by PROTO-NESTED-ROUTE; independent interface state remains PROTO-INTERFACE-STATE."
- id: DIAG-NESTED-PROTO-USE
  interfaces: [X3DPrototypeInstance]
  nodes: [ProtoInstance]
  component: Core
  clause: "4.4.4.3"
  severity: minor
  status: fixed
  summary: "CLI reported a declaration used only by another prototype as unused."
  note: "The CLI and differential gate now share declaration-identity use analysis. It scans locally authored declaration bodies, retained nested declarations, and locally bound instance declarations with a visited worklist; external instances count only their external declaration. CLI regressions cover nested use, a node-contained declaration retained only by its instance, unused outer declaration with a used shadowing inner declaration, and an unresolved but used external declaration. The existing unused-declaration warning remains unchanged."
- id: PROTO-CHILD-ORDER
  interfaces: [X3DPrototypeInstance]
  nodes: [ProtoInstance]
  component: Core
  clause: "4.4.3; 4.4.4.3"
  severity: major
  status: fixed
  summary: "Nested prototype expansion appended instances after ordinary MFNode children, changing authored order."
  note: "Expansion now reconstructs affected MFNode slots from the reconciled body-node ledger after nested instances expand. Ordinary children retain clone-map identity and USE aliases; failed instances are omitted without reordering surviving children. proto_expand_test.cpp verifies XML, JSON and Classic ordering, aliasing, independent outer instances, and failed nested instances."
- id: PROTO-DIRECT-DEFAULT
  interfaces: [X3DPrototypeInstance]
  nodes: [ProtoInstance]
  component: Core
  clause: "4.4.4.2; 4.4.4.3; 4.4.4.4"
  severity: major
  status: fixed
  summary: "Direct ProtoInstance SFNode/MFNode interface defaults were not retained as expandable prototype instances."
  note: "ProtoInstanceTemplate occupies the existing nodeDefault vector and local DEF table. Readers and four writers retain order and DEF/USE aliases across fields and body graphs; expansion materializes required templates per outer instance before IS forwarding. Overrides suppress unused defaults and external resolution, while caller node identity is preserved. Scene writers emit external declarations before dependent local declarations. directDefaultInstanceTest, directDefaultInstanceIsForwardTest, unresolvedDirectDefaultRoundTripTest and proto_expand_test.cpp resolver-count cases exercise these paths. This is an authored template representation, not full native SAI prototype support."
- id: PROTO-NODE-VALUE-INSTANCE
  interfaces: [X3DPrototypeInstance]
  nodes: [ProtoInstance]
  component: Core
  clause: "4.4.4.2; 4.4.4.3"
  severity: major
  status: fixed
  summary: "Prototype instances inside node-valued fieldValues were not bound and expanded reliably."
  note: "XML, Classic and JSON readers now retain direct and contained SFNode/MFNode instance values as bound templates. Expansion shares each caller template's primary across USE aliases while preserving ordinary caller node identity; declaration-owned values still clone per outer instance. Scene-root DEF templates link to their authoritative structural records. Unresolved caller templates remain inert and serializable. Four writers preserve expanded primary DEF/USE identity. instanceNodeValueRootTest, instanceNodeValueMixedTest, instanceNodeValueSharedCallerTest, unresolvedInstanceNodeValueTest and the throwing-resolver regression cover expansion, placement, sharing, failure and round trips. CLI use analysis and source UNIT traversal include these graphs. Scene root order remains open under PROTO-SCENE-ORDER."
- id: PROTO-SCENE-ORDER
  interfaces: [X3DPrototypeInstance]
  nodes: [ProtoInstance]
  component: Core
  clause: "4.3.2; 4.4.4.3; 7.2.2"
  severity: major
  status: fixed
  summary: "Scene prototype expansion appended primaries after ordinary roots or children, changing authored node order and initial binding."
  note: "Root and Group.children reproductions converted First, Ordinary, Last to Ordinary, First, Last. A runtime binding probe selected the later ordinary Viewpoint over an earlier local prototype primary. Readers now place instance templates directly in authored root/child slots; structural records link weakly to those exact identities. Expansion replaces slots in place, and four writers preserve order and repeated USE occurrences. Unresolved instances retain inert slots. Removed unnamed slots remain distinguishable from unlinked programmatic records, avoiding fallback resurrection. Raw writers use structural source edits, and expansion synchronizes renamed DEF bindings. Classic root USE statements now have a separator before the next root. sceneRootProtoOrderTest, unresolvedRootProtoOrderTest, rootProtoMutationTest, sceneChildProtoOrderTest and firstProtoViewpointBindsTest cover raw and expanded paths, three encodings, four writers, removal, alias identity and actual initial binding. PROTO-NESTED-WRITE and other prototype requirements remain separate."
- id: PROTO-NESTED-ROUTE
  interfaces: [X3DPrototypeInstance]
  nodes: [ProtoInstance]
  component: Core
  clause: "4.4.4.3; 4.4.4.4; 4.4.8.2"
  severity: major
  status: fixed
  summary: "Body-local ROUTEs targeting IS-mapped nested prototype interfaces were silently omitted."
  note: "The baseline retained one authored route but produced zero resolved routes and no warning. Expansion now resolves local DEFs after nested expansion and snapshots child interfaces before an enclosing instance reuses their primary pointer. Both ROUTE endpoints follow declared interface aliases and IS targets to concrete edges; nested IS event mappings are flattened into the outer interface. The scene bridge validates nominal interfaces and physical direction/types, hides undeclared primary fields, and preserves inherited metadata via existing primary storage. Parsed XML/Classic tests exercise actual event delivery, private instance isolation, nested-first shared primaries, physical and nested IS aliases, inherited metadata, scene PROTO-to-PROTO routes and invalid endpoints. Independent interface state without IS remains open under PROTO-INTERFACE-STATE; this does not claim complete prototype semantics."
- id: PROTO-INTERFACE-STATE
  interfaces: [X3DPrototypeInstance]
  nodes: [ProtoInstance]
  component: Core
  clause: "4.4.2.2; 4.4.4.2; 4.4.4.3"
  severity: major
  status: fixed
  summary: "Unconnected prototype interface fields lacked independent state and routable endpoints."
  note: "FIXED for scalar and SFNode/MFNode interface fields. Expansion registers unmapped fields on each primary in DynamicFieldStore, preserving access types and existing IS redirects. Node defaults reuse the per-instance clone map, keeping declaration nodes private across instances while preserving internal DEF/USE aliases; caller fieldValue overrides retain identity, and explicit NULL/empty values suppress defaults. proto_interface_state_test.cpp verifies external SFNode/MFNode relays (2 routes, 0 rejected), same-pointer event delivery, NULL/empty updates, initializeOnly SFNode defaults, MFNode defaults, instance isolation and caller sharing. Existing scalar, nested-sibling, shared-primary and EXTERNPROTO cases remain. This establishes stored state and endpoints for the named cases; it does not establish complete prototype semantics or traversal of arbitrary dynamic node graphs."

# Optional consumer raster helper; this does not broaden the headless SDK claim.
- id: TXT-ATLAS-LATIN1
  nodes: [Text, FontStyle]
  component: Text
  clause: "15.4.1, 15.4.2; Annex E FontStyle support"
  severity: major
  status: fixed
  summary: The optional stbtt atlas drops Latin-1 Supplement glyphs present in its supplied font.
  note: >-
    Fixed for the helper's bounded repertoire: makeStbttGlyphAtlas bakes U+0020–U+007E and U+00A0–U+00FF,
    preserving raw advances and packing complete raster glyph boxes so accents/overhangs are not cut off.
    x3d_text_atlas_tests checks every supported glyph's pixels, UVs, and baseline-relative geometry metrics
    against isolated rasterization across all three bundled Liberation faces at 8/17/64 px per em;
    blank spaces, range boundaries, missing families/files and unsupported codepoints are covered.
    DEL/C1 controls, out-of-range codepoints and .notdef still fail; styles still use the supplied PLAIN face.
    No claim of general Unicode/shaping support or whole-browser Immersive conformance. The headless SDK
    continues to use the consumer's FontMetrics seam; the CPU consumer's independent 8x8 font is still ASCII-only.
    Issue https://github.com/delta9000/x3d-cpp/issues/141.

- id: EXTRACT-VISIBILITY-HINT-DELTA
  nodes: [Viewpoint, NavigationInfo, Transform, Billboard, Shape]
  severity: minor
  status: fixed
  summary: "Optional RenderItem origin-distance visibility hints stayed stale after view, limit and placement changes."
  note: "Issue #155: SceneExtractor now compares effective farDistance/visibilityLimit and current per-placement origins before consuming a delta. A changed live boolean uses the existing bounded remove-before-add replacement, so hosts honoring only advertised channels receive the descriptor; unchanged hints preserve incremental geometry/material/TRS behavior. Finite-to-unlimited clears true hints, empty/revived items read current inputs, and packed items use the same origin rule as AoS. Unlimited-to-unlimited ticks skip per-item checks; finite view/limit changes scan live origins, reusing static matrices and recomposing only dirty/Billboard paths. A crossing still costs a full bounded extraction. Tests: scene_extractor_visibility_delta_test.cpp has expected-value checks and a channel-respecting mirror versus fresh snapshots for precedence/fallback/bindings, eye/viewpoint motion, ancestor TRS, disabled limits, shared and empty placements, and packed stability. This is an optional SDK origin-distance hint, not bounds/frustum culling or complete visibility conformance."

# Native host-activation integration safety (not a claim of full SAI coverage).
- id: NATIVE-CALLBACK-RETIREMENT
  interfaces: [X3DBindableNode, X3DInterpolatorNode, X3DFollowerNode]
  nodes: [BooleanTrigger, IntegerTrigger, TimeTrigger, BooleanFilter, BooleanToggle, BooleanSequencer, IntegerSequencer, HAnimMotion]
  clause: "4.4.3 (execution-context integration lifetime)"
  severity: critical
  status: fixed
  summary: Native runtime callbacks retained by nodes are revoked before their activation or behavior state is destroyed.
  note: >-
    Weak per-context and per-system callback leases cover bindable handlers,
    interpolators (including spline, NURBS and geospatial), followers,
    event utilities, HAnimMotion and context-owned timing/key/trigger hooks.
    RuntimeSession retires before extractor teardown; context destruction also
    covers partial-construction unwinding. Standalone BindingSystem and standard
    callback-owning systems retire in their destructor bodies before member
    captures can invoke a retained node. Custom most-derived systems must call
    the protected early-retirement hook before destroying members. No raw-node
    traversal or global
    lifetime registry is used, so retirement cannot clear a replacement's
    handlers. Runtime/extract/tests/runtime_callback_retirement_test.cpp pins
    retained storage, valid behavior, replacement, failed construction,
    independent owner lifetimes and reentrant retirement rejection. Native
    access stays serial: the host defers destruction until no call is in flight;
    reentrant destruction fails closed. Context, BindingSystem and System owners
    are noncopyable/nonmovable; transfer owning pointers or build fresh owners.
    Custom unguarded callbacks and GeoFrame configuration isolation are outside
    this fix; author-field ownership is tracked separately below. Process-wide pick/local-matrix diagnostic counters
    use relaxed atomics so distinct owner-thread worlds do not race on metrics;
    runtime_diagnostic_counters_test.cpp verifies the combined totals. These
    metrics are not per-world semantic state. This does not establish full
    browser/SAI conformance.

- id: ASSET-LOADER-TRANSITIVE-POLICY
  interfaces: [X3DPrototypeInstance]
  nodes: [Inline]
  clause: "4.4.4.2; 9.2 (host I/O policy and source-URL integration)"
  severity: critical
  status: fixed
  summary: Nested Inline and EXTERNPROTO parsing preserves the supplied AssetResolver policy and declaration-source bases without local-file fallback.
  note: >-
    Paired synchronous loaders carry one explicit resolver policy throughout
    Inline/EXTERNPROTO recursion, including declaration caching, body expansion
    and IS URL overrides; Pending aborts the recursive synchronous load.
    Source-base provenance follows declarations and weak node ownership instead
    of being replaced by the enclosing document URL. Local Inline file loading
    uses the existing confinement/canonicalization helper. The focused
    asset_loader_policy_test.cpp and asset_proto_resolver_test.cpp suite verifies
    nested and mixed resolution, URL fallback, cached declaration reuse, Pending
    propagation and real local-decoy zero-read/open evidence with a positive
    control. This closes an I/O integration bypass; it does not assert full
    asynchronous loading or browser/SAI conformance.


- id: NATIVE-AUTHOR-FIELD-OWNERSHIP
  interfaces: [X3DPrototypeInstance, X3DScriptNode]
  nodes: [Script, Inline, GeoLOD]
  clause: "4.4.4; 9.2; 29.2 (native ownership and host integration)"
  severity: critical
  status: fixed
  summary: Scene and declaration owners replace process-global author-field storage and clone factory configuration.
  note: >-
    Fresh Scenes have fresh shared stores; shallow copies deliberately alias
    graph and store. Readers, writers, execution/cascade and Script backends
    propagate explicit owners. Declarations retain template data after temporary
    source-document destruction, while clones get fresh author entries and use
    one clone map for generated and author node-valued fields. Inline adoption
    shares entry identity, parent detach removes only its view, and cached
    GeoLOD tiles re-import preserved child entries before attachment. Authored
    GeoLOD roots retain their own selected entry view while inactive and return
    it to the Scene on redisplay. Tracked
    copied FieldInfo thunks reject expired and wrong-node identities without
    waiting for a store sweep. Extension factories are declaration-local and
    ext::install no longer mutates process configuration. Regression evidence:
    scene_author_field_ownership_test.cpp and migrated memory, cascade, codec,
    parser and Script tests. This is a concrete source/ABI migration with no
    singleton or TLS fallback, not full Script/PROTO/SAI conformance. The separate
    Geo projection selector and local-file parse operation context remain.

# Interactive profile (Annex C) reference host acceptance, 2026-10-10.
# runtime/extract/tests/interactive_profile_test.cpp drives an XML scene through
# RuntimeSession's public input seam; these are the gaps it found or confirmed.
- id: IACC-1
  nodes: [CylinderSensor]
  component: PointingDeviceSensor
  clause: "20.4.1"
  severity: major
  status: fixed
  summary: CylinderSensor rotation_changed turned the opposite way to the drag.
  note: "The disk and cylinder angle used cross(ref, cur).y with the wrong sign, so dragging from +Z toward +X produced a negative rotation about +Y; §20.4.1 specifies the right-handed rotation from the original intersection. A routed Transform therefore spun against the pointer, and minAngle/maxAngle clamped the wrong side. drag/CylinderDrag.hpp now uses ref.z*cur.x - ref.x*cur.z; drag_math_test pins the right-handed sign and interactive_profile_test covers cylinder and disk drags end to end, including clamp and autoOffset."
- id: IACC-2
  nodes: [BooleanToggle]
  component: EventUtilities
  clause: "30.4.3"
  severity: minor
  status: fixed
  summary: Two TRUE set_boolean events in one cascade both computed the toggle from the same stored value.
  note: "Each TRUE now flips the stored state at once and schedules one re-read publication per cascade, so N TRUE inputs flip N times and storage, observers and ROUTEs agree on one toggle_changed with the final value. FALSE stays a no-op and set_toggle is ordinary inputOutput delivery. If set_toggle and a later TRUE both arrive in one cascade, state and observers follow both while the outgoing ROUTE keeps the legacy one-delivery-per-timestamp cap shared by every inputOutput field. Tests: event_utility_output_admission_test (BooleanToggle cases) and interactive_profile_test's routed click state machine."
- id: IACC-3
  nodes: [BooleanSequencer, IntegerSequencer]
  component: EventUtilities
  clause: "30.2.4"
  severity: minor
  status: fixed
  summary: Sequencers emitted value_changed for every set_fraction, not once per key interval.
  note: "SequencerSystem remembers the key interval of the last fraction that emitted and stays silent while later fractions remain in it. next/previous and key/keyValue edits forget that interval, so the following fraction emits even in the same interval. Per-cascade output admission is unchanged: a fraction suppressed by admission still selects its interval. Tests: event_utility_output_admission_test (`sequencer emits one value_changed per key interval across timestamps`) and interactive_profile_test's TimeSensor-driven sequencers."
- id: IACC-4
  nodes: [Anchor]
  component: Networking
  clause: "9.4.1"
  severity: minor
  status: fixed
  summary: A RuntimeSession host could not receive Anchor activations whose url is not an in-scene viewpoint.
  note: "AnchorSystem already bound \"#Name\" viewpoints and called an optional handler for other urls, but attachInteractive created the system without exposing it. SessionOptions::anchorHandler (and an attachInteractive parameter) now install the handler, which receives the url and parameter lists. The headless runtime still loads nothing itself. Test: interactive_profile_test Anchor case."

