  status: closed
  summary: The entire 2D-geometry component is unrecognized by the mesh builder and renders nothing — indistinguishable from a parser failure.
  note: >-
    Closed: recognizedGeometryType now lists all eight 2D primitives and buildGeometry2D tessellates them, so
    SceneExtractor no longer drops Disk2D/Arc2D/ArcClose2D/Circle2D/Rectangle2D/Polyline2D/Polypoint2D/TriangleSet2D
