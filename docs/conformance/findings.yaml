  note: "Registered event systems for all three NURBS interpolators reuse runtime/extract/NurbsEval.hpp for rational curve and surface evaluation; tangent orientation follows increasing knot direction. Covered by interpolator_conformance_test (linear curve, rational quarter circle/tangent, bilinear surface, degenerate input)."
- id: NRB-4
  nodes: [NurbsCurve, NurbsPatchSurface]
  interfaces: [X3DNurbsControlCurveNode, X3DNurbsSurfaceGeometryNode]
  component: NURBS
  clause: "27.3"
  severity: minor
  status: fixed
  summary: "NURBS controlPoint weight convention now defaults to premultiplied (matching the whole shipping ecosystem), with an opt-in Euclidean/textbook mode."
  note: "Resolved by option (b): runtime/extract/NurbsEval.hpp gained a NurbsWeightMode { Premultiplied, Euclidean } on CurveDef/SurfaceDef, threaded through evalSurface/tessellateCurve, and surfaced as MeshBuildOptions::nurbsWeightMode. The DEFAULT is Premultiplied — controlPoint is used verbatim as the homogeneous xyz — because the entire shipping X3D ecosystem requires it: primary-source list evidence (x3d-public 2020-05, 'Nurbs control points, preweighted or not?') has Andreas Plesch ('all freeWrl, view3dscene and InstantPlayer expect premultiplied control points') and Michalis Kamburelis ('all X3D browsers require points to be premultiplied by the given weight'), the convention was set by the blaxxun/bitmanagement browser ~20 years ago, White Dune stores premultiplied handles, and X3DOM deliberately switched to it (Plesch, 2020-05-28); the X3D 4.0 keep-compat decision preserved it. The literal textbook/spec-formula reading (§27, multiply weight*controlPoint inside the evaluator) remains available via NurbsWeightMode::Euclidean. X3D §27 is genuinely silent on the convention, so both are spec-permitted; the default is chosen for interop faithfulness. weight==1 content (the common case + every existing golden, incl. the unit-weight Bezier teapot) is bit-identical under both modes — verified by nurbs_curve_unit_weights_mode_agnostic. Coverage: nurbs_curve_exact_unit_circle (Euclidean corners) + nurbs_curve_premultiplied_unit_circle (premultiplied corners, default mode) both trace the exact unit circle. NRB-3's deferred trimmed/swept/swung surfaces should reuse s.weightMode when they land."
