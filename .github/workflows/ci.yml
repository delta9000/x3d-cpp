# Path classification limits backend builds to relevant changes.
# Path-skipped jobs may be required branch-protection checks: GitHub treats
# their skipped conclusion as passing.
# Gate purposes: docs/wiki/guides/gate-system.md.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Cancel superseded runs for the same workflow and ref.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Manual dispatch requests every class; Python checks always run.
  changes:
    name: detect changed subsystems
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      quickjs: ${{ steps.f.outputs.quickjs }}
      cpp: ${{ steps.f.outputs.cpp }}
      generator: ${{ steps.f.outputs.generator }}
      docs: ${{ steps.f.outputs.docs }}
      sai: ${{ steps.f.outputs.sai }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          fetch-depth: 0
      - id: f
        env:
          BASE: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          if [ -z "${BASE:-}" ]; then
            python3 scripts/classify_ci_changes.py --all >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git fetch --no-tags --prune origin "$BASE"
          base_sha="$(git merge-base HEAD "origin/$BASE")"
          changed="$(git diff --name-only "$base_sha" HEAD)"
          echo "changed vs $BASE ($base_sha):"; echo "$changed"
          printf '%s\n' "$changed" | python3 scripts/classify_ci_changes.py >> "$GITHUB_OUTPUT"

  checks:
    name: pytest + golden + conformance view + wiki build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
      - name: Install pinned clang-format (golden formatting is byte-exact)
        uses: jdx/mise-action@c37c93293d6b742fc901e1406b8f764f6fb19dac  # v2
        with:
          install_args: clang-format
      - name: Set up uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86  # v5
        with:
          version: "0.10.4"   # keep in sync with mise.toml [tools]
          enable-cache: true
      - name: Sync (incl dev group)
        run: uv sync
      - name: Run pytest (including golden tree)
        run: uv run pytest
      - name: Check conformance view (schema + drift)
        run: uv run python scripts/conformance_view.py check
      - name: Build wiki (strict)
        run: uv run --group docs mkdocs build --strict

  cpp:
    name: C++ build + ctest (gcc, PR gate)
    needs: changes
    if: needs.changes.outputs.cpp == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
      - name: Install compiler + cmake + ninja + ccache + libcurl
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build ccache g++ mold libcurl4-openssl-dev
      - name: ccache cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830  # v4
        with:
          path: ~/.cache/ccache
          key: ccache-behavior-${{ github.sha }}
          restore-keys: ccache-behavior-
      - name: Bound ccache storage
        run: ccache --max-size=750M
      - name: Configure (ci preset + optional backends)
        run: cmake --preset ci -DX3D_CPP_BUILD_STB=ON -DX3D_CPP_BUILD_WUFFS=ON -DX3D_CPP_BUILD_QUICKJS=ON -DX3D_CPP_BUILD_CURL=ON -DX3D_CPP_BUILD_STBTT=ON
      - name: Build behavior targets
        run: cmake --build --preset ci --target x3d_behavior_tests
      - name: Test behavior suite
        run: ctest --preset ci -L behavior --output-on-failure -j "$(nproc)"
      - name: Build compile contracts
        run: cmake --build --preset ci --target x3d_compile_contracts
      - name: Test compile contracts
        run: ctest --preset ci -L compile-contract --output-on-failure -j "$(nproc)"
      - name: Build backend tests (texture decode, script engine, HTTP resolver, fonts)
        run: cmake --build --preset ci --target x3d_texture_tests x3d_quickjs_backend_test x3d_quickjs_swap x3d_assetresolver_backend_a_test x3d_assetresolver_swap x3d_text_tests x3d_text_atlas_tests
      - name: Backend tests (stb_image vs wuffs; Duktape vs QuickJS; libcurl; stbtt)
        run: ctest --preset ci --output-on-failure -R 'x3d_texture|x3d_quickjs(_backend|_swap)|x3d_assetresolver(_backend|_swap)|x3d_text_'

  # The opt-in runtime/ext extensions build in their own tree; mirrors
  # `mise run build-ext`.
  ext:
    name: C++ opt-in extensions (runtime/ext) build + ctest
    needs: changes
    if: needs.changes.outputs.cpp == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
      - name: Install compiler + cmake + ninja + ccache
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build ccache g++ mold
      - name: ccache cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830  # v4
        with:
          path: ~/.cache/ccache
          key: ccache-ext-${{ github.sha }}
          restore-keys: ccache-ext-
      - name: Bound ccache storage
        run: ccache --max-size=500M
      - name: Configure (`ext` preset)
        run: cmake --preset ext
      - name: Build ext tests
        run: cmake --build --preset ext --target x3d_ext_tests
      - name: Test ext suite
        run: ctest --preset ext -j "$(nproc)"

  # The SAI SDK in sai/ is its own CMake project and uv package; mirrors
  # `mise run sai-ci` (UOM pin, generator determinism, SAI registers, generator
  # pytest, C++ build + ctest).
  sai:
    name: SAI SDK (sai/) registers + build + ctest
    needs: changes
    if: needs.changes.outputs.sai == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: sai
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
      - name: Set up uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86  # v5
        with:
          version: "0.10.4"   # keep in sync with mise.toml [tools]
          enable-cache: true
          cache-dependency-glob: sai/uv.lock
      - name: Install compiler + cmake + ninja + ccache
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build ccache g++
      - name: ccache cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830  # v4
        with:
          path: ~/.cache/ccache
          key: ccache-sai-${{ github.sha }}
          restore-keys: ccache-sai-
      - name: Bound ccache storage
        run: ccache --max-size=300M
      - name: Sync generator environment
        run: uv sync --locked
      - name: UOM pin + generator determinism
        run: |
          uv run python -m x3d_sai_gen.cli --check-uom-only
          uv run python -m x3d_sai_gen.cli --check
      - name: SAI service + invariant registers
        run: |
          uv run python scripts/check_sai_services.py
          uv run python scripts/check_sai_invariants.py
      - name: Generator pytest
        run: uv run pytest tests/ -q
      - name: Build
        env:
          CMAKE_CXX_COMPILER_LAUNCHER: ccache
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo
          cmake --build build --parallel "$(nproc)"
      - name: CTest
        run: |
          python3 scripts/check_ctest_selection.py build
          ctest --test-dir build --output-on-failure -j "$(nproc)"

  # Native provider (adapters/sai_provider) against the in-tree SAI SDK: source
  # build, relocated install and the ordinary host consumer. Mirrors
  # `mise run sai-provider`.
  sai-adapter:
    name: SAI native provider + relocated packages
    needs: changes
    if: needs.changes.outputs.cpp == 'true' || needs.changes.outputs.sai == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
      - name: Install compiler + cmake + ninja + ccache
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build ccache g++ mold
      - name: ccache cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830  # v4
        with:
          path: ~/.cache/ccache
          key: ccache-sai-adapter-${{ github.sha }}
          restore-keys: ccache-sai-adapter-
      - name: Bound ccache storage
        run: ccache --max-size=500M
      - name: Provider proof (source build, relocated install, host consumer)
        env:
          CMAKE_BUILD_PARALLEL_LEVEL: 4
          CMAKE_CXX_COMPILER_LAUNCHER: ccache
        run: bash scripts/verify_sai_provider.sh sai "$RUNNER_TEMP/sai-provider"

  # The san preset instruments executed behavior tests in a separate build tree.
  cpp-san:
    name: C++ sanitizer gate (ASan + UBSan)
    needs: changes
    if: needs.changes.outputs.cpp == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
      - name: Install compiler + cmake + ninja + ccache
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build ccache g++ mold
      - name: ccache cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830  # v4
        with:
          path: ~/.cache/ccache
          key: ccache-san-${{ github.sha }}
          restore-keys: ccache-san-
      - name: Bound ccache storage
        run: ccache --max-size=750M
      - name: Configure (ASan + UBSan via the `san` preset)
        run: cmake --preset san
      - name: Build (sanitized)
        run: cmake --build --preset san --target x3d_sanitizer_tests
      - name: Test (behavior suite under ASan + UBSan)
        run: ctest --preset san -L behavior --output-on-failure -j "$(nproc)"

  # Coverage-guided parser mutation; sanitizer failures and crashes fail the job.
  cpp-fuzz:
    name: C++ fuzz gate (libFuzzer parseDocument)
    needs: changes
    if: needs.changes.outputs.cpp == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
      - name: Install Clang + cmake + ninja + ccache
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build ccache clang
      - name: ccache cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830  # v4
        with:
          path: ~/.cache/ccache
          key: ccache-fuzz-${{ github.sha }}
          restore-keys: ccache-fuzz-
      - name: Configure + build the libFuzzer harness (`fuzz` preset)
        run: |
          cmake --preset fuzz
          cmake --build --preset fuzz --target x3d_parse_fuzz
      # Bounded smoke: 60s of coverage-guided mutation. libFuzzer returns nonzero
      # (and writes a crash-<hash> reproducer) on any ASan/UBSan finding, failing
      # the gate. -print_final_stats surfaces coverage/exec counts in the log.
      - name: Fuzz (bounded 60s smoke)
        run: |
          mkdir -p build-fuzz/corpus
          cp runtime/parse/tests/fuzz_corpus/*.x3d runtime/parse/tests/fuzz_corpus/*.x3dv runtime/parse/tests/fuzz_corpus/*.json build-fuzz/corpus/
          ./build-fuzz/x3d_parse_fuzz build-fuzz/corpus \
            -dict=runtime/parse/tests/x3d_fuzz.dict \
            -max_total_time=60 -print_final_stats=1

  proj-swap:
    name: GeoProjection seam swap-test
    needs: changes
    if: needs.changes.outputs.cpp == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
      - name: Install compiler and PROJ
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build ccache g++ mold libproj-dev
      - name: Configure (PROJ backend ON)
        run: cmake -S . -B build -G Ninja -DX3D_CPP_BUILD_PROJ=ON
      - name: Build GeoProjection swap-test
        run: cmake --build build --target x3d_proj_geo_swap -j4
      - name: Swap-test (built-in vs PROJ)
        run: ctest --test-dir build --output-on-failure -R x3d_proj_geo_swap -V

  # Build the example consumers and exercise real GL under software rendering.
  # See scripts/validate-examples.sh.
  examples-gate:
    name: Example consumers (cpu_raster + poc, headless GL)
    needs: changes
    if: needs.changes.outputs.cpp == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
      - name: Install build tools + GLFW build deps + headless GL (Xvfb + mesa)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake ninja-build ccache g++ mold \
            libwayland-dev libxkbcommon-dev wayland-protocols extra-cmake-modules \
            libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev \
            xvfb libgl1-mesa-dri mesa-utils libgl-dev
      - name: ccache cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830  # v4
        with:
          path: ~/.cache/ccache
          key: ccache-examples-${{ github.sha }}
          restore-keys: ccache-examples-
      - name: Build both examples + headless probes + Xvfb GL smoke
        run: scripts/validate-examples.sh

  # Exploratory macOS/MSVC smoke; failures do not block merges.
  cross-platform-smoke:
    name: Cross-platform smoke (${{ matrix.os }}, exploratory)
    needs: changes
    if: github.event_name != 'pull_request' && needs.changes.outputs.cpp == 'true'
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4

      # macOS: native Apple Clang (arm64) + Ninja via Homebrew.
      - name: (macOS) Install Ninja
        if: runner.os == 'macOS'
        run: brew install ninja
      - name: (macOS) Configure + build + test
        if: runner.os == 'macOS'
        run: |
          cmake --preset dev
          cmake --build --preset dev --target x3d_events_tests x3d_fileresolver_test
          ctest --preset dev -R 'x3d_events_tests|x3d_fileresolver_test' --output-on-failure

      # Windows: native MSVC (cl) via the VS Developer environment (vswhere +
      # VsDevCmd — no third-party action, keeping the Forgejo mirror + SHA-pin
      # conventions intact). Ninja ships with Visual Studio.
      - name: (Windows) Configure + build + test (MSVC)
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath`) do set "VSPATH=%%i"
          call "%VSPATH%\Common7\Tools\VsDevCmd.bat" -arch=x64 || exit /b 1
          cmake --preset dev || exit /b 1
          cmake --build --preset dev --target x3d_events_tests x3d_fileresolver_test || exit /b 1
          ctest --preset dev -R "x3d_events_tests|x3d_fileresolver_test" --output-on-failure

  # Heavy baseline matrix — pins oldest supported (GCC 11 / Clang 14) + current
  # compilers. Manual only (the 4× build is too heavy for every PR push).
  cpp-matrix:
    name: C++ baseline matrix (${{ matrix.name }})
    if: github.event_name == 'workflow_dispatch'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: gcc-11,        os: ubuntu-22.04, apt: g++-11,  cc: gcc-11,  cxx: g++-11 }
          - { name: clang-14,      os: ubuntu-22.04, apt: clang-14, cc: clang-14, cxx: clang++-14 }
          - { name: gcc-default,   os: ubuntu-latest, apt: g++,    cc: gcc,     cxx: g++ }
          - { name: clang-default, os: ubuntu-latest, apt: clang,  cc: clang,   cxx: clang++ }
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
      - name: Install compiler + cmake + ninja + ccache
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build ccache ${{ matrix.apt }}
      - name: ccache cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830  # v4
        with:
          path: ~/.cache/ccache
          key: ccache-${{ matrix.name }}-${{ github.sha }}
          restore-keys: ccache-${{ matrix.name }}-
      - name: Configure
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
        # Require warning-clean builds with every matrix compiler.
        run: cmake -S . -B build -G Ninja -DX3D_CPP_WERROR=ON
      - name: Build
        run: cmake --build build
      - name: Test
        run: ctest --test-dir build --output-on-failure -j "$(nproc)"
