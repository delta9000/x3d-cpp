site_name: x3d-cpp documentation
site_description: Tutorials, how-to guides, reference and explanation for the x3d-cpp runtime SDK and the SAI SDK.
site_author: Ben Sandbrook
repo_url: https://github.com/delta9000/x3d-cpp
docs_dir: docs/wiki

theme:
  name: material
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.highlight
    - search.share
    - content.code.annotate
  palette:
    - scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

plugins:
  - search

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Tutorials:
      - Load, run and extract your first scene: tutorials/first-scene.md
      - Tour the x3d command line: tutorials/cli-tour.md
  - How-to guides:
